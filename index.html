<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Пепельная Луна</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Ruslan+Display&display=swap">
<style>
/* Layout: one-screen mobile RPG — HUD strip, full-bleed map canvas, bottom nav; sheets slide over it. Single dark world by design. */
:root{
  --night:#0d0a11; --panel:#18121e; --panel2:#231a2b; --line:#3a2c44;
  --blood:#a3172b; --blood-hi:#e0384f; --bone:#ebe1cd; --muted:#9c90a6;
  --gold:#d9a441; --energy:#5b82ff; --xp:#9a6cf0; --ok:#8fbf6a;
  --r0:#cfc6b4; --r1:#6fa8ff; --r2:#c08bff; --r3:#ffa448;
  --f-display:"Ruslan Display","Philosopher",Georgia,serif;
  --f-body:"Philosopher","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--night)}
body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--bone);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#hud{padding-block:8px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--panel),var(--night));border-bottom:1px solid var(--line)}
.hud-row{display:flex;align-items:center;gap:10px}
.lvl{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:radial-gradient(circle at 35% 30%,var(--blood-hi),var(--blood) 60%,#4a0812);box-shadow:0 0 0 2px #2a0a12,0 0 12px #a3172b66}
.bars{flex:1;display:grid;gap:4px;min-width:0}
.bar{position:relative;display:block;height:14px;border-radius:3px;background:#0a070d;border:1px solid var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .25s}
.bar.hp i{background:linear-gradient(var(--blood-hi),var(--blood))}
.bar.en i{background:linear-gradient(#86a2ff,var(--energy))}
.bar.xp{height:5px}.bar.xp i{background:var(--xp)}
.bar span{position:relative;display:block;font-size:11px;line-height:12px;text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.gold{flex:none;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:5px}
.gold::before{content:"";width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe29a,var(--gold) 55%,#7a5412)}
.mus{flex:none;position:relative;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:var(--panel2);color:var(--gold);font-size:17px;line-height:1}
.mus.off{border-color:var(--line);color:var(--muted)}
.mus.off::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:2px;background:var(--blood-hi);transform:rotate(-45deg)}
.vol{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.vol input{flex:1;min-width:0;accent-color:var(--blood-hi);height:28px}
.vol output{width:3.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--bone)}
.zone{margin-top:5px;font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.zone b{color:var(--bone);font-weight:400}
#view{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:8px 14px;border-radius:6px;background:#18121ee8;border:1px solid var(--line);font-size:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.on{opacity:1}
#nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--night),var(--panel));border-top:1px solid var(--line)}
#nav button{position:relative;padding:11px 2px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:14px;letter-spacing:.03em}
#nav button:active{background:var(--line)}
.dot{position:absolute;top:5px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--blood-hi);box-shadow:0 0 8px var(--blood-hi)}
.dot.q{background:var(--gold);box-shadow:0 0 8px var(--gold)}

/* sheets */
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:#05030880;padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
.sheet{width:100%;max-width:540px;max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -10px 40px #000a;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet-head{display:flex;align-items:center;gap:12px;padding-block:14px 10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;margin:0;font-family:var(--f-display);font-weight:400;font-size:21px;letter-spacing:.02em;text-wrap:balance;color:var(--bone)}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-size:20px;line-height:1}
.sheet-body{overflow-y:auto;padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.sheet-body p{margin:0;line-height:1.5;color:#d8cdbb}
.lore{font-style:italic;color:var(--muted)!important}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;white-space:nowrap;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--bone);border-color:var(--blood)}
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:700}
.row .t small{color:var(--muted);font-size:13px}
.row img.ic{width:40px;flex:none;image-rendering:pixelated}
.btns{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.btn{padding:9px 14px;border-radius:6px;border:1px solid #6b1422;background:linear-gradient(#b81f35,#7f1022);color:#fff;font-weight:700;white-space:nowrap}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--bone);font-weight:400}
.btn.wide{width:100%;padding:13px}
.tag{font-size:12px;color:var(--muted);white-space:nowrap}
.tag.eq{color:var(--ok)}
.up{color:var(--ok)}.down{color:#e06a6a}
.price{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
h3{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-size:15px;letter-spacing:.06em;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.stat .t{flex:1}.stat .t small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.plus{width:30px;height:30px;border-radius:50%;border:1px solid #6b1422;background:var(--blood);color:#fff;font-size:18px;line-height:1}
.derived{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:13px;color:var(--muted)}
.derived span b{display:block;color:var(--bone);font-size:17px;font-variant-numeric:tabular-nums}
.quest{padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);display:grid;gap:5px}
.quest.done{opacity:.5}.quest.cur{border-color:var(--blood)}.quest.ready{border-color:var(--ok)}
.quest b{font-size:16px}.quest small{color:var(--muted);line-height:1.4}
.prog{height:6px;border-radius:3px;background:#0a070d;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}
.big{text-align:center;display:grid;gap:8px;justify-items:center}
.big .glyph{font-family:var(--f-display);font-size:44px;color:var(--blood-hi);text-shadow:0 0 20px #a3172b}
.loot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.loot span{padding:6px 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}
.row.rb1{border-color:#2c4a7a}.row.rb2{border-color:#5a3a82}.row.rb3{border-color:#8a5420}
.lines{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.pips{color:var(--gold);letter-spacing:2px;font-size:12px}
.mm{width:100%;max-width:420px;aspect-ratio:1;image-rendering:pixelated;border:1px solid var(--line);border-radius:8px;justify-self:center;background:#050308}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* combat */
.combat{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;gap:9px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse 120% 60% at 50% 18%,#3a0f1c,var(--night) 70%)}
.c-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.c-title{font-family:var(--f-display);font-size:19px}
.c-turn{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.foes{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:10px}
.foe{position:relative;width:min(31%,150px);padding:8px 6px 8px;border-radius:10px;border:1px solid var(--line);background:#150f1acc;display:grid;gap:3px;justify-items:center;transition:opacity .4s,transform .15s}
.foe img{width:78%;image-rendering:pixelated;filter:drop-shadow(0 6px 6px #000);transform-origin:50% 100%;animation:idle 2.6s ease-in-out infinite}
.foe:nth-child(2) img{animation-delay:-.9s}.foe:nth-child(3) img{animation-delay:-1.7s}
.foe[data-sp="wraith"] img,.foe[data-sp="vspawn"] img{animation:float 3.2s ease-in-out infinite}
.foe.boss img{filter:drop-shadow(0 6px 6px #000) drop-shadow(0 0 14px #e0384f88)}
.foe.dead img{animation:none}
@keyframes idle{50%{transform:translateY(-2px) scaleY(1.03)}}
@keyframes float{50%{transform:translateY(-8px)}}
.foe.boss{width:min(48%,210px)}
.foe.sel{border-color:var(--blood-hi);box-shadow:0 0 0 1px var(--blood-hi),0 0 18px #e0384f44}
.foe.dead{opacity:.18;filter:grayscale(1)}
.foe .lv{position:absolute;top:5px;left:7px;font-size:11px;color:var(--muted)}
.foe .fn{font-size:13px;line-height:1.15;text-align:center;min-height:2.3em;display:flex;align-items:center}
.foe .bar{width:100%;height:8px}
.foe .hpt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sts{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:15px}
.sts i{font-style:normal;font-size:10px;line-height:13px;padding:1px 4px;border-radius:3px;background:#3a1420;color:#ffb0b8}
.sts i.burn{background:#4a2410;color:#ffc27a}.sts i.stun{background:#2a2a40;color:#c8d0ff}.sts i.weak{background:#2a3020;color:#c8e0a0}
.sts i.pois{background:#1e3a1a;color:#a8f08a}.sts i.buff{background:#3a3010;color:#ffe08a}
.hit{animation:hit .3s}
@keyframes hit{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}}
.fl{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:700;font-size:20px;pointer-events:none;text-shadow:0 2px 4px #000;animation:fl .9s forwards;white-space:nowrap;z-index:2}
.fl.dmg{color:#fff}.fl.crit{color:var(--gold);font-size:25px}.fl.miss{color:var(--muted);font-size:15px}.fl.heal{color:var(--ok)}.fl.en{color:#9db4ff}.fl.hurt{color:var(--blood-hi)}.fl.dot{color:#ffb070;font-size:16px}
@keyframes fl{to{transform:translate(-50%,-42px);opacity:0}}
.clog{height:4.5em;overflow:hidden;font-size:13px;line-height:1.12em;color:var(--muted);display:flex;flex-direction:column;justify-content:flex-end}
.clog div:last-child{color:var(--bone)}
.c-hero{position:relative;display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.c-hero img{width:42px;image-rendering:pixelated}
.c-hero .bars{gap:4px}
.c-hero .sts{justify-content:flex-start;min-height:0}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sk{min-height:48px;padding:5px 4px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);display:grid;align-content:center;gap:2px;text-align:center;font-size:13.5px;line-height:1.1}
.sk small{font-size:11px;color:var(--muted)}
.sk.atk{border-color:#5e1422;background:linear-gradient(#2c1420,#1c1018)}
.sk.util{min-height:40px;background:transparent}
.sk:disabled{opacity:.35;cursor:default}
.sk:not(:disabled):active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.combat{align-items:center}.combat>*{width:100%;max-width:560px}}
</style>

<div id="app">
  <header id="hud">
    <div class="hud-row">
      <div class="lvl" id="hLvl">1</div>
      <div class="bars">
        <span class="bar hp"><i id="hHp"></i><span id="hHpT"></span></span>
        <span class="bar en"><i id="hEn"></i><span id="hEnT"></span></span>
        <span class="bar xp"><i id="hXp"></i></span>
      </div>
      <div class="gold" id="hGold">0</div>
      <button class="mus off" id="nMusic" type="button" aria-label="Включить музыку">♪</button>
    </div>
    <div class="zone"><span id="hZone">Окрестности Брода</span><b id="hThreat">угроза 1</b></div>
  </header>
  <main id="view"><canvas id="cv"></canvas><div id="toast"></div></main>
  <nav id="nav">
    <button id="nHero" type="button">Герой<b id="ptsDot" class="dot" hidden></b></button>
    <button id="nQuest" type="button">Задания<b id="qDot" class="dot q" hidden></b></button>
    <button id="nMap" type="button">Карта</button>
    <button id="nMenu" type="button">Меню</button>
  </nav>
</div>

<div id="ov" class="overlay" hidden></div>

<div id="combat" class="combat" hidden>
  <div class="c-top"><div class="c-title" id="cTitle">Схватка</div><div class="c-turn" id="cTurn">Ход 1</div></div>
  <div class="foes" id="foes"></div>
  <div class="clog" id="clog"></div>
  <div class="c-hero" id="cHero">
    <img id="cHeroImg" alt="">
    <div class="bars">
      <span class="bar hp"><i id="cHp"></i><span id="cHpT"></span></span>
      <span class="bar en"><i id="cEn"></i><span id="cEnT"></span></span>
      <span class="sts" id="cHeroSts"></span>
    </div>
  </div>
  <div class="skills" id="skills"></div>
</div>

const sprCache={},urlCache={};
function getSprite(name,over){
  const key=name+(over?JSON.stringify(over):'');
  if(sprCache[key])return sprCache[key];
  const d=SPR[name],pal=Object.assign({},d.pal,over||{});
  // 1px dark outline + top light / bottom shade so figures read as solid shapes
  const w=Math.max(...d.rows.map(r=>r.length))+2,h=d.rows.length+2;
  const grid=new Array(w*h).fill(null);
  d.rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch==='.')continue;const col=pal[ch];if(col)grid[(j+1)*w+i+1]=col}});
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    const k=j*w+i,col=grid[k];
    if(col){const up=j>0&&grid[k-w],dn=j<h-1&&grid[k+w];x.fillStyle=!up?shade(col,.22):!dn?shade(col,-.28):col;x.fillRect(i,j,1,1)}
    else if((i>0&&grid[k-1])||(i<w-1&&grid[k+1])||(j>0&&grid[k-w])||(j<h-1&&grid[k+w])){x.fillStyle='#0b070e';x.fillRect(i,j,1,1)}
  }
  return sprCache[key]=c;
}
function shade(hex,a){
  let n=parseInt(hex.slice(1),16);if(hex.length===4)n=parseInt(hex.slice(1).split('').map(ch=>ch+ch).join(''),16);
  const t=a>0?255:0,p=Math.abs(a),m=v=>Math.round(v+(t-v)*p);
  return`rgb(${m(n>>16&255)},${m(n>>8&255)},${m(n&255)})`;
}
function spriteURL(name,over){const key=name+(over?JSON.stringify(over):'');return urlCache[key]||(urlCache[key]=getSprite(name,over).toDataURL())}

function rollRar(luck=0){const x=Math.random();return x<.02+luck*.04?3:x<.12+luck*.15?2:x<.42+luck*.2?1:0}
function genItem(slot,lvl,rar,baseId){
  lvl=clamp(Math.round(lvl),1,20);
  let b;
  if(baseId)b=BASE_BY[baseId];
  else{const list=BASES[slot].filter(x=>x.lv<=lvl);b=list[Math.max(0,list.length-1-Math.floor(Math.random()*Math.min(2,list.length)))]}
  const r=rar==null?rollRar():rar;
  const it={uid:S.uid++,slot:b.slot||slot,base:b.id,lvl:Math.max(lvl,b.lv),rar:r,up:0,aff:{}};
  const sc=(1+(it.lvl-b.lv)*.06)*(r===3?1.25:1);
  for(const k of['atk','def','hp','en'])if(b[k])it[k]=Math.max(1,Math.round(b[k]*sc));
  if(b.imp)for(const k in b.imp)it.aff[k]=b.imp[k];
  const pool=SLOT_AFF[it.slot].slice();
  for(let i=0;i<RAR[r].aff&&pool.length;i++){const k=pool.splice(Math.floor(Math.random()*pool.length),1)[0];it.aff[k]=(it.aff[k]||0)+Math.max(1,Math.round(AFF[k].f(it.lvl)*rnd(.75,1.15)))}
  if(r===3)it.name=pick(LEG_NAMES);
  return it;
}

function power(it){if(!it)return 0;let p=itemStat(it,'atk')*3+itemStat(it,'def')*3+itemStat(it,'hp')/4+itemStat(it,'en')/2;for(const k in it.aff)if(!['atk','def','hp','en'].includes(k))p+=it.aff[k]*2;return p}
function itemLines(it){
  const out=[];for(const k of['atk','def','hp','en']){const v=itemStat(it,k);if(v)out.push(`${AFF[k].n} +${v}`)}

let tiles,dangerMap,biomeMap,locAt={};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genWorld(seed){
  const R=mulberry32(seed);
  const lattice=n=>{const g=[];for(let i=0;i<(n+2)*(n+2);i++)g.push(R());return g};
  const sm=t=>t*t*(3-2*t);
  const noise=(g,n,x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),u=sm(x-xi),v=sm(y-yi),at=(i,j)=>g[j*(n+2)+i];
    const a=at(xi,yi),b=at(xi+1,yi),c=at(xi,yi+1),d=at(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
  const n1=9,n2=20,g1=lattice(n1),g2=lattice(n2),m1=lattice(n1);
  tiles=new Uint8Array(W*H);dangerMap=new Uint8Array(W*H);biomeMap=new Uint8Array(W*H);locAt={};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const h=noise(g1,n1,x/W*n1,y/H*n1)*.7+noise(g2,n2,x/W*n2,y/H*n2)*.3;
    const m=noise(m1,n1,x/W*n1,y/H*n1);
    const edge=Math.min(x,y,W-1-x,H-1-y);
    let t=h<.33?T_WATER:h>.7?T_MOUNT:m>.52?T_FOREST:T_GRASS;
    if(edge<1)t=T_MOUNT;
    const k=y*W+x;tiles[k]=t;
    dangerMap[k]=clamp(1+Math.floor(Math.hypot(x-START.x,y-START.y)/5),1,20);
    biomeMap[k]=(x<46&&y<26)?1:(x>50&&y>46&&y<77)?2:0;
  }
  const L=id=>LOCS.find(l=>l.id===id);
  const carve=(a,b)=>{let x=a.x,y=a.y;
    while(x!==b.x||y!==b.y){const dx=b.x-x,dy=b.y-y;let hz=Math.abs(dx)>Math.abs(dy);if(dx&&dy&&R()<.3)hz=!hz;
      if(hz)x+=Math.sign(dx);else y+=Math.sign(dy);tiles[y*W+x]=T_ROAD}};
  for(const[a,b]of ROADS)carve(L(a),L(b));
  const towns=LOCS.filter(l=>l.type==='town');
  for(const l of LOCS)if(l.type==='npc'||l.type==='shrine'){
    let best=towns[0],bd=1e9;for(const t of towns){const d=Math.abs(t.x-l.x)+Math.abs(t.y-l.y);if(d<bd){bd=d;best=t}}
    carve(l,best);
  }
  for(const l of LOCS){
    const r=(l.type==='town'||l.type==='boss')?2:1;
    for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const x=l.x+i,y=l.y+j;if(x<1||y<1||x>W-2||y>H-2)continue;const k=y*W+x;if(tiles[k]===T_WATER||tiles[k]===T_MOUNT)tiles[k]=T_GRASS}
    tiles[l.y*W+l.x]=T_ROAD;locAt[l.y*W+l.x]=l;
  }
}
const passable=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&tiles[y*W+x]!==T_WATER&&tiles[y*W+x]!==T_MOUNT;
const danger=(x,y)=>dangerMap[y*W+x];

function migrate(o){
  if(o.ver===SAVE_VER)return o;
  const s=newState();S=s;
  for(const k of['lvl','xp','gold','str','agi','vit','wil','pts','pots','elix','tails','trophies','bosses','kills','won'])if(o[k]!==undefined)s[k]=o[k];

function mkEnemy(type,L){
  const d=EN[type],k=L-1,max=d.fixedHp?d.hp:Math.round(d.hp*(1+.3*k));
  return{type,n:d.n,sp:d.sp,pal:d.pal,lvl:L,max,hp:max,atk:Math.round(d.atk*(1+.17*k)),def:d.def+Math.floor(L/2),dg:d.dg,sk:d.sk,
    xp:Math.round((4+d.hp/6)*(1+.55*k)),gold:Math.round((2+d.atk/2)*(1+.45*k)*rnd(.7,1.3)),turn:0,st:{}};
}
function mkBoss(id){const b=BOSS[id];return{type:id,n:b.n,sp:b.sp,pal:b.pal,lvl:b.lvl,max:b.hp,hp:b.hp,atk:b.atk,def:b.def,dg:b.dg,sk:b.sk,xp:b.xp,gold:b.gold,turn:0,boss:true,st:{}}}
function groupTypes(L,bio){
  const pool=[];for(const k in EN){const d=EN[k];if(d.min>L||d.max<L)continue;const w=d.bio?(d.bio===bio?5:0.3):1;pool.push([k,w])}
  const tot=pool.reduce((a,p)=>a+p[1],0);
  const one=()=>{let r=Math.random()*tot;for(const p of pool){r-=p[1];if(r<=0)return p[0]}return pool[0][0]};
  const n=1+(Math.random()<.5?1:0)+(L>2&&Math.random()<.3?1:0);
  return Array.from({length:n},one);
}
function spawnGroup(far,near){
  // near: spawn around a point (the player or the start) so the area you are in never runs dry
  for(let tries=0;tries<300;tries++){
    let x,y;
    if(near){x=near.x+Math.round(rnd(-16,16));y=near.y+Math.round(rnd(-16,16));if(x<1||y<1||x>W-2||y>H-2)continue}
    else{x=1+Math.floor(Math.random()*(W-2));y=1+Math.floor(Math.random()*(H-2))}
    if(!passable(x,y)||locAt[y*W+x])continue;
    if(LOCS.some(l=>Math.abs(l.x-x)+Math.abs(l.y-y)<(l.type==='town'?4:2)))continue;
    if(far&&Math.abs(S.x-x)+Math.abs(S.y-y)<8)continue;
    if(S.enemies.some(g=>g.x===x&&g.y===y))continue;
    const L=clamp(danger(x,y)+(Math.random()<.2?1:0),1,20);
    S.enemies.push({uid:S.uid++,x,y,L,types:groupTypes(L,biomeMap[y*W+x]),stun:0});
    return;
  }
}
const ENEMY_CAP=115;
function moveEnemies(){
  for(const g of S.enemies){
    if(g.stun>0){g.stun--;continue}
    const dx=S.x-g.x,dy=S.y-g.y,d=Math.abs(dx)+Math.abs(dy);
    if(d>14)continue;
    let nx=g.x,ny=g.y;
    if(d<=3&&Math.random()<.7){
      if(Math.abs(dx)>Math.abs(dy)||(Math.abs(dx)===Math.abs(dy)&&Math.random()<.5))nx+=Math.sign(dx);else ny+=Math.sign(dy);
    }else if(Math.random()<.25){const dir=pick([[1,0],[-1,0],[0,1],[0,-1]]);nx+=dir[0];ny+=dir[1]}
    if((nx!==g.x||ny!==g.y)&&passable(nx,ny)&&!locAt[ny*W+nx]&&!S.enemies.some(o=>o!==g&&o.x===nx&&o.y===ny)){g.x=nx;g.y=ny}
  }
}
const groupAt=(x,y)=>S.enemies.find(g=>g.x===x&&g.y===y&&g.stun<=0);

/* ---------- quests ---------- */
function qProgress(id){
  const q=QUESTS[id],st=S.q[id];if(!st)return 0;
  if(q.k==='visit')return Math.min(q.c,['ob1','ob2','ob3'].filter(o=>S.shr[o]).length);
  if(q.k==='have')return Math.min(q.c,S.tails||0);
  if(q.k==='boss')return S.bosses[q.e]?1:0;
  return Math.min(q.c,st.have||0);
}
const qNeed=id=>QUESTS[id].c||1;
const qReady=id=>S.q[id]&&S.q[id].st==='active'&&qProgress(id)>=qNeed(id);
function qAvail(id){const q=QUESTS[id];return!S.q[id]&&(!q.req||(S.q[q.req]&&S.q[q.req].st==='done'))}
function npcMark(npc){
  let m=null;for(const id in QUESTS){if(QUESTS[id].g!==npc)continue;if(qReady(id))return'?';if(qAvail(id)&&S.lvl>=QUESTS[id].lv)m='!'}return m;
}
function onKill(type){
  const msgs=[];
  for(const id in S.q){const q=QUESTS[id],st=S.q[id];if(!q||st.st!=='active'||q.e!==type)continue;
    if(q.k==='kill'&&st.have<q.c)st.have++;
    if(q.k==='collect'&&st.have<q.c&&Math.random()<.55){st.have++;msgs.push(`${q.item} (${st.have}/${q.c})`)}}
  return msgs;
}
function rewardText(r){
  const p=[];if(r.gold)p.push(`${r.gold} золота`);if(r.xp)p.push(`${r.xp} опыта`);if(r.sp)p.push(`${r.sp} очк. навыков`);if(r.pts)p.push(`${r.pts} очк. характеристик`);
  if(r.pots)p.push(`зелья ×${r.pots}`);if(r.elix)p.push(`эликсиры ×${r.elix}`);if(r.item)p.push(`${RAR[r.item[1]].n.toLowerCase()} предмет: ${SLOT_N[r.item[0]].toLowerCase()}`);
  return p.join(', ');
}

  else if(bio===2)base=t===T_ROAD?`hsl(40,18%,${20+v*.6}%)`:t===T_MOUNT?`hsl(100,6%,${17+v*.5}%)`:t===T_FOREST?`hsl(110,20%,${11+v*.5}%)`:`hsl(${85+v*3},22%,${15+v*.6}%)`;

function levelColor(L){const d=L-S.lvl;return d<=-2?'#7f8a72':d<=0?'#d6cfbe':d<=2?'#e6b445':'#ff4a5e'}

  ctx.fillStyle='#050308';ctx.fillRect(0,0,vw,vh);

  ox=Math.round(vw/2-(ax+.5)*T);oy=Math.round(vh/2-(ay+.5)*T);
  const x0=Math.max(0,Math.floor(-ox/T)),x1=Math.min(W-1,Math.ceil((vw-ox)/T)),y0=Math.max(0,Math.floor(-oy/T)),y1=Math.min(H-1,Math.ceil((vh-oy)/T));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const px=ox+x*T,py=oy+y*T;
    if(!S.explored[y*W+x])continue;
    drawTile(tiles[y*W+x],x,y,px,py,ts);
    const dx=x-S.x,dy=y-S.y;
    if(dx*dx+dy*dy>SIGHT*SIGHT+1){ctx.fillStyle='rgba(6,4,10,.5)';ctx.fillRect(px,py,T+1,T+1)}
  }

    const px=ox+l.x*T,py=oy+l.y*T;
    if(l.type==='boss'){ctx.fillStyle=S.bosses[l.boss]?'rgba(0,0,0,.25)':`rgba(224,56,79,${.18+.1*Math.sin(ts/400)})`;ctx.beginPath();ctx.arc(px+T/2,py+T/2,T*.48,0,7);ctx.fill()}
    if(l.type==='shrine'&&!S.shr[l.id]){ctx.fillStyle=`rgba(150,210,255,${.16+.1*Math.sin(ts/500)})`;ctx.beginPath();ctx.arc(px+T/2,py+T/2,T*.46,0,7);ctx.fill()}
    if(l.type==='npc'){
      const n=NPCS[l.npc];ctx.drawImage(getSprite('npc',n.pal),px+T*.12,py+T*.04,T*.76,T*.76);
      const m=npcMark(l.npc);if(m){ctx.font=`700 ${Math.round(T*.42)}px Philosopher, sans-serif`;ctx.fillStyle='#0b070e';ctx.fillText(m,px+T/2+1,py+T*.05+1+Math.sin(ts/250)*2);ctx.fillStyle=m==='?'?'#8fdf6a':'#ffd24a';ctx.fillText(m,px+T/2,py+T*.05+Math.sin(ts/250)*2)}
    }else{
      const sp=l.type==='town'?'town':l.type==='shrine'?'obelisk':l.spr;

    }
  }
  if(path.length){ctx.fillStyle='rgba(235,225,205,.55)';for(const p of path){ctx.beginPath();ctx.arc(ox+p.x*T+T/2,oy+p.y*T+T/2,Math.max(2,T*.06),0,7);ctx.fill()}
    const e=path[path.length-1];ctx.strokeStyle='rgba(235,225,205,.7)';ctx.lineWidth=2;ctx.strokeRect(ox+e.x*T+3,oy+e.y*T+3,T-6,T-6)}
  ctx.font=`700 ${Math.round(T*.24)}px Philosopher, sans-serif`;
  for(const g of S.enemies){
    const dx=g.x-S.x,dy=g.y-S.y;if(dx*dx+dy*dy>SIGHT*SIGHT+1)continue;
    const px=ox+g.x*T,py=oy+g.y*T,bob=Math.sin(ts/300+g.uid)*1.5,d=EN[g.types[0]];
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(px+T/2,py+T*.88,T*.3,T*.08,0,0,7);ctx.fill();

function bfs(tx,ty){
  if(!passable(tx,ty)||!S.explored[ty*W+tx])return null;
  const prev=new Int32Array(W*H).fill(-1),start=S.y*W+S.x,goal=ty*W+tx;prev[start]=start;
  const q=[start];
  for(let qi=0;qi<q.length;qi++){
    const c=q[qi];if(c===goal)break;
    const cx=c%W,cy=(c/W)|0;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy,n=ny*W+nx;
      if(!passable(nx,ny)||prev[n]!==-1||!S.explored[n])continue;
      if(locAt[n]&&n!==goal)continue;
      prev[n]=c;q.push(n)}
  }
  if(prev[goal]===-1)return null;
  const out=[];let c=goal;while(c!==start){out.unshift({x:c%W,y:(c/W)|0});c=prev[c]}
  return out;
}
const busy=()=>!$('#combat').hidden||!$('#ov').hidden;
cv.addEventListener('pointerup',e=>{
  if(busy())return;
  const r=cv.getBoundingClientRect(),tx=Math.floor((e.clientX-r.left-ox)/T),ty=Math.floor((e.clientY-r.top-oy)/T);
  if(tx===S.x&&ty===S.y){const l=locAt[ty*W+tx];if(l)enterLoc(l);path=[];return}
  const p=bfs(tx,ty);
  if(p&&p.length)path=p;else{path=[];toast(S.explored[ty*W+tx]?'Туда не пройти':'Эти земли ещё не разведаны')}
});
document.addEventListener('keydown',e=>{
  if(busy())return;
  const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(!d)return;e.preventDefault();const nx=S.x+d[0],ny=S.y+d[1];
  if(passable(nx,ny))path=[{x:nx,y:ny}];

function stepTo(n){
  anim={fx:S.x,fy:S.y,t0:performance.now()};
  S.prev={x:S.x,y:S.y};S.x=n.x;S.y=n.y;S.steps++;reveal();
  if(S.steps%3===0)S.hp=Math.min(maxHp(),S.hp+1);
  if(S.steps%2===0)S.en=Math.min(maxEn(),S.en+1);
  let g=groupAt(S.x,S.y);
  const l=locAt[S.y*W+S.x];
  if(g){path=[];fightGroup(g);return}
  if(l){path=[];updateHud();enterLoc(l);save();return}
  moveEnemies();
  g=groupAt(S.x,S.y);
  if(g){path=[];fightGroup(g);return}
  if(S.steps%10===0){
    const nearby=S.enemies.filter(g=>Math.abs(g.x-S.x)+Math.abs(g.y-S.y)<18).length;
    if(nearby<9)spawnGroup(true,S);else if(S.enemies.length<ENEMY_CAP)spawnGroup(true);
  }
  if(S.steps%10===0)save();
  updateHud();
}
function loop(ts){
  if(path.length&&!busy()&&ts-lastStep>150){lastStep=ts;stepTo(path.shift())}
  Snd.setTrack(moodNow());
  render(ts);requestAnimationFrame(loop);
}

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2000)}
function zoneName(){
  const l=locAt[S.y*W+S.x];if(l)return l.name||NPCS[l.npc].n;
  const b=biomeMap[S.y*W+S.x];if(b===1)return'Ледяные пустоши';if(b===2)return'Гнилые топи';
  const dg=danger(S.x,S.y);return dg<=2?'Окрестности Брода':dg<=5?'Пепельные пустоши':dg<=8?'Вороньи земли':dg<=12?'Мёртвые холмы':dg<=16?'Багровый предел':'Тень Ноктюрна';
}
function updateHud(){
  S.hp=Math.min(S.hp,maxHp());S.en=Math.min(S.en,maxEn());
  $('#hLvl').textContent=S.lvl;
  $('#hHp').style.width=(S.hp/maxHp()*100)+'%';$('#hHpT').textContent=`${S.hp} / ${maxHp()}`;
  $('#hEn').style.width=(S.en/maxEn()*100)+'%';$('#hEnT').textContent=`${S.en} / ${maxEn()}`;
  $('#hXp').style.width=Math.min(100,S.xp/xpNeed(S.lvl)*100)+'%';
  $('#hGold').textContent=S.gold;
  const l=locAt[S.y*W+S.x];
  $('#hZone').textContent=zoneName();
  $('#hThreat').textContent=l&&l.type==='town'?'безопасно':'угроза '+danger(S.x,S.y);

function makeStock(tier,trader){
  const lv=trader?S.lvl:Math.min(S.lvl+1,TIER_MAX[tier]),out=[];
  for(const s of SLOTS)out.push(genItem(s,lv,trader?(Math.random()<.12?3:Math.random()<.45?2:1):(Math.random()<.12?2:Math.random()<.45?1:0)));
  for(let i=0;i<(trader?3:2);i++)out.push(genItem(pick(SLOTS),lv,trader?(Math.random()<.3?2:1):(Math.random()<.3?1:0)));
  return out;
}

  if(l.type==='town'){S.lastTown=l.id;curTown=l;townTab='inn';shopStock[l.id]=makeStock(l.tier,false);openSheet(l.name,townBody);return}

    if(S.shr[l.id]){openSheet(l.name,()=>`<p class="lore">Камень холоден. Его свет ты уже унёс с собой.</p><button class="btn ghost wide" data-act="close">Уйти</button>`);return}

}

}

/* npc */
let npcFrom=false;
function openNpc(id,fromTown){
  npcFrom=!!fromTown;const n=NPCS[id];
  if(n.shop&&!shopStock.trader)shopStock.trader=makeStock(0,true);
  if(n.shop&&!fromTown)shopStock.trader=makeStock(0,true);
  openSheet(n.n,()=>npcBody(id));
}
function npcBody(id){
  const n=NPCS[id];
  let h=`<div class="row"><img class="ic" src="${spriteURL('npc',n.pal)}" alt=""><div class="t"><p class="lore">«${n.hello}»</p></div></div>`;
  const qs=Object.keys(QUESTS).filter(q=>QUESTS[q].g===id);
  for(const q of qs){
    const Q=QUESTS[q],st=S.q[q];
    if(st&&st.st==='done'){h+=`<div class="quest done"><b>✓ ${Q.n}</b></div>`;continue}
    if(st){const pr=qProgress(q),need=qNeed(q),ready=pr>=need;
      h+=`<div class="quest ${ready?'ready':'cur'}"><b>${Q.n}</b><small>${Q.t}</small><small>Прогресс: ${pr} / ${need}${Q.k==='collect'?` (${Q.item})`:''}. Награда: ${rewardText(Q.r)}</small><div class="prog"><i style="width:${pr/need*100}%"></i></div>
       ${ready?`<button class="btn wide" data-act="turnIn" data-arg="${q}">Сдать задание</button>`:''}</div>`;continue}
    if(!qAvail(q))continue;
    if(S.lvl<Q.lv){h+=`<div class="quest"><b>${Q.n}</b><small>Приходи, когда окрепнешь (уровень ${Q.lv}).</small></div>`;continue}
    h+=`<div class="quest cur"><b>${Q.n}</b><small>${Q.t}</small><small>Награда: ${rewardText(Q.r)}</small><button class="btn wide" data-act="takeQ" data-arg="${q}">Принять задание</button></div>`;
  }
  if(n.shop)h+=`<h3>Товары</h3>${shopRows('trader',1.3)}`;
  h+=npcFrom?`<button class="btn ghost wide" data-act="backTown">Назад</button>`:`<button class="btn ghost wide" data-act="close">Уйти</button>`;
  return h;
}
ACT.takeQ=q=>{if(!qAvail(q))return;S.q[q]={st:'active',have:0};toast(`Задание принято: ${QUESTS[q].n}`)};
ACT.turnIn=q=>{
  if(!qReady(q))return;const Q=QUESTS[q],r=Q.r;S.q[q].st='done';
  if(Q.k==='have')S.tails-=Q.c;
  if(r.gold)S.gold+=r.gold;if(r.xp)S.xp+=r.xp;if(r.sp)S.sp+=r.sp;if(r.pts)S.pts+=r.pts;if(r.pots)S.pots+=r.pots;if(r.elix)S.elix+=r.elix;
  let got='';if(r.item){const it=genItem(r.item[0],Math.max(S.lvl,Q.lv)+1,r.item[1]);const m=addItem(it);got=m||` Получено: ${itemName(it)}.`}
  const u=levelUps();Snd.sfx(u?'level':'win');
  toast(`Задание выполнено!${got}${u?' Новый уровень!':''}`);
};

/* hero */

      return`<div class="row" style="${lock?'opacity:.5':''}"><div class="t"><b>${s.n} <span class="pips">${'●'.repeat(r)}${'○'.repeat(5-r)}</span></b><small>${r?SKB[s.id].d(r):'Не изучен'}${s.en?` · ${s.id==='rush'&&r>=4?6:s.en} эн.`:''}</small>${r<5&&!lock?`<span class="lines">Дальше: ${SKB[s.id].d(r+1)}</span>`:''}</div>${btn}</div>`}).join('')}</div>`;
  }else if(heroTab==='gear'){
    h+=`<h3>Надето</h3><div class="rows">${SLOTS.map(s=>{const it=S.eq[s];return it?`<div class="row rb${it.rar}"><div class="t">${itemHTML(it)}</div><button class="btn ghost sm" data-act="unequip" data-arg="${s}">Снять</button></div>`:`<div class="row"><div class="t"><b style="color:var(--muted)">${SLOT_N[s]}: пусто</b></div></div>`}).join('')}</div>
    <h3>Рюкзак (${S.inv.length} / ${INV_MAX})</h3>`;

        <button class="btn ghost wide" data-act="sellJunk">Продать все обычные вещи</button>`}
  }else{
    h+=`<div class="rows">
     <div class="row"><div class="t"><b>Зелье крови × ${S.pots}</b><small>Лечит 45% здоровья</small></div><button class="btn" data-act="usePot" ${!S.pots||S.hp>=maxHp()?'disabled':''}>Выпить</button></div>

     ${Object.keys(S.q).filter(q=>QUESTS[q].k==='collect'&&S.q[q].st==='active').map(q=>`<div class="row"><div class="t"><b>${QUESTS[q].item} × ${S.q[q].have}</b><small>Для задания «${QUESTS[q].n}»</small></div></div>`).join('')}</div>`;
  }
  return h;
}
ACT.htab=k=>{heroTab=k;const b=ov.querySelector('.sheet-body');if(b)b.scrollTop=0};
ACT.stat=k=>{if(!S.pts)return;S.pts--;S[k]++;if(k==='vit')S.hp+=10;if(k==='wil')S.en+=4};
ACT.learn=id=>{const s=SKB[id];if(S.sp<1||S.lvl<s.lv||rank(id)>=5)return;S.sp--;S.skills[id]=rank(id)+1;Snd.sfx('level')};
ACT.equip=u=>{const i=S.inv.findIndex(it=>it.uid===+u);if(i<0)return;const it=S.inv[i];S.inv.splice(i,1);const old=S.eq[it.slot];if(old)S.inv.push(old);S.eq[it.slot]=it;S.hp=Math.min(S.hp,maxHp())};
ACT.unequip=s=>{const it=S.eq[s];if(!it)return;if(S.inv.length>=INV_MAX){toast('Рюкзак полон');return}S.inv.push(it);S.eq[s]=null;S.hp=Math.min(S.hp,maxHp());S.en=Math.min(S.en,maxEn())};
ACT.sellIt=u=>{const i=S.inv.findIndex(it=>it.uid===+u);if(i<0)return;const g=sellPrice(S.inv[i]);S.gold+=g;S.inv.splice(i,1);Snd.sfx('coin')};
ACT.sellJunk=()=>{let g=0;S.inv=S.inv.filter(it=>{if(it.rar===0){g+=sellPrice(it);return false}return true});if(g){S.gold+=g;Snd.sfx('coin');toast(`Продано на ${g} золота`)}};
ACT.usePot=()=>{if(!S.pots)return;S.pots--;S.hp=Math.min(maxHp(),S.hp+Math.round(maxHp()*.45))};
ACT.useElix=()=>{if(!S.elix)return;S.elix--;S.en=Math.min(maxEn(),S.en+Math.round(maxEn()*.6))};

function mapBody(){

  <div class="legend"><span><b style="background:#ffd24a"></b>Вы</span><span><b style="background:#d9a441"></b>Поселение</span><span><b style="background:#e0384f"></b>Босс</span><span><b style="background:#8fdf6a"></b>Задание</span><span><b style="background:#8fd0ff"></b>Обелиск</span></div>
  <p class="lore">На карте видно только то, что вы уже разведали.</p>`;

function drawMini(){
  const c=$('#mm');if(!c)return;const x=c.getContext('2d');
  x.fillStyle='#050308';x.fillRect(0,0,c.width,c.height);
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){const k=j*W+i;if(!S.explored[k])continue;const t=tiles[k],b=biomeMap[k];
    x.fillStyle=t===T_WATER?(b===1?'#6d8ea0':b===2?'#1f3a30':'#1c2e4c'):t===T_MOUNT?(b===1?'#8a94a4':'#4a4452'):t===T_ROAD?'#6a5440':t===T_FOREST?(b===1?'#4a5a64':b===2?'#22301c':'#1e3a26'):(b===1?'#7a8a98':b===2?'#2a3a20':'#38422c');
    x.fillRect(i*4,j*4,4,4)}
  for(const l of LOCS){if(!S.explored[l.y*W+l.x])continue;
    x.fillStyle=l.type==='town'?'#d9a441':l.type==='boss'?(S.bosses[l.boss]?'#5a4a50':'#e0384f'):l.type==='shrine'?(S.shr[l.id]?'#4a6070':'#8fd0ff'):(npcMark(l.npc)?'#8fdf6a':'#a09080');
    x.fillRect(l.x*4-3,l.y*4-3,10,10)}
  x.fillStyle='#ffd24a';x.fillRect(S.x*4-4,S.y*4-4,12,12);x.strokeStyle='#000';x.lineWidth=2;x.strokeRect(S.x*4-4,S.y*4-4,12,12);
}

let C=null;
const cEl=$('#combat');
function fightGroup(g){startCombat(g.types.map(t=>mkEnemy(t,g.L)),{group:g.uid,title:g.types.length>1?'Засада':'Схватка'})}
function startCombat(foes,o){
  path=[];
  C={foes,tgt:0,log:[],busy:false,guard:null,cry:null,pois:null,group:o.group||null,boss:o.boss||null,turn:1,tails:0,qmsg:[]};

  $('#foes').innerHTML=foes.map((f,i)=>`<button type="button" class="foe${f.boss?' boss':''}" data-i="${i}" data-sp="${f.sp}"><span class="lv">ур. ${f.lvl}</span><img src="${spriteURL(f.sp,f.pal)}" alt=""><span class="fn">${f.n}</span><span class="bar hp"><i></i></span><span class="hpt"></span><span class="sts"></span></button>`).join('');

$('#foes').addEventListener('click',e=>{const b=e.target.closest('.foe');if(!b||!C)return;const i=+b.dataset.i;if(C.foes[i].hp>0){C.tgt=i;updCombat()}});
$('#skills').addEventListener('click',e=>{const b=e.target.closest('.sk');if(b&&!b.disabled)act(b.dataset.s)});
function clog(m){C.log.push(m);if(C.log.length>4)C.log.shift();$('#clog').innerHTML=C.log.map(l=>`<div>${l}</div>`).join('')}
function stsHTML(st){const o=[];if(!st)return'';
  if(st.bleed)o.push(`<i>кровь ${st.bleed.t}</i>`);if(st.burn)o.push(`<i class="burn">огонь ${st.burn.t}</i>`);if(st.stun)o.push('<i class="stun">оглушён</i>');if(st.weak)o.push(`<i class="weak">слабость ${st.weak}</i>`);return o.join('')}
function updCombat(){
  if(!C)return;
  $('#cTurn').textContent='Ход '+C.turn;
  document.querySelectorAll('.foe').forEach((el,i)=>{const f=C.foes[i];
    el.classList.toggle('sel',i===C.tgt&&f.hp>0);el.classList.toggle('dead',f.hp<=0);
    el.querySelector('i').style.width=(f.hp/f.max*100)+'%';el.querySelector('.hpt').textContent=`${f.hp} / ${f.max}`;
    el.querySelector('.sts').innerHTML=f.hp>0?stsHTML(f.st):''});
  S.hp=Math.min(S.hp,maxHp());S.en=Math.min(S.en,maxEn());
  $('#cHp').style.width=(S.hp/maxHp()*100)+'%';$('#cHpT').textContent=`${S.hp} / ${maxHp()}`;
  $('#cEn').style.width=(S.en/maxEn()*100)+'%';$('#cEnT').textContent=`${S.en} / ${maxEn()}`;
  const hs=[];if(C.pois)hs.push(`<i class="pois">яд ${C.pois.t}</i>`);if(C.cry)hs.push(`<i class="buff">клич ${C.cry.t}</i>`);if(C.guard)hs.push('<i class="stun">защита</i>');
  $('#cHeroSts').innerHTML=hs.join('');
  document.querySelectorAll('.sk').forEach(b=>{const id=b.dataset.s,s=SKB[id],sm=b.querySelector('small');
    let dis=C.busy;
    if(s){const r=rank(id);if(!r){dis=true;sm.textContent=S.lvl<s.lv?'с ур. '+s.lv:'изучите';}else{const c=skCost(id);sm.textContent=(c?c+' эн.':'—')+' · '+r;if(S.en<c)dis=true}}
    else if(id==='pot'){sm.textContent='× '+S.pots;if(!S.pots)dis=true}
    else if(id==='elix'){sm.textContent='× '+S.elix;if(!S.elix)dis=true}
    else if(id==='flee'){sm.textContent=C.boss?'нельзя':Math.min(95,45+S.agi*2)+'%';if(C.boss)dis=true}
    b.disabled=dis});
}
function floatOn(el,txt,cls){if(!el)return;const s=document.createElement('span');s.className='fl '+cls;s.textContent=txt;el.appendChild(s);setTimeout(()=>s.remove(),900)}
function shakeEl(el){if(!el)return;el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}
const foeEl=f=>document.querySelector(`.foe[data-i="${C.foes.indexOf(f)}"]`);
function heal(n,quiet){if(n<=0)return;if(!quiet)Snd.sfx('heal');const before=S.hp;S.hp=Math.min(maxHp(),S.hp+n);if(S.hp>before)floatOn($('#cHero'),'+'+(S.hp-before),'heal')}
function addSt(f,k,t,d){if(f.hp<=0)return;if(k==='stun'||k==='weak'){f.st[k]=Math.max(f.st[k]||0,t)}else{const c=f.st[k];f.st[k]={t:Math.max(t,c?c.t:0),d:Math.max(d||1,c?c.d:0)}}}
const patk=()=>atk()*(C&&C.cry?1+C.cry.p:1);
function procs(f,d){
  const v=gs('vamp');if(v)heal(Math.round(d*v/100),true);
  if(f.hp<=0)return;
  if(Math.random()*100<gs('bleed'))addSt(f,'bleed',3,Math.round(atk()*.25));
  if(Math.random()*100<gs('burn'))addSt(f,'burn',3,Math.round(atk()*.3));
  if(Math.random()*100<gs('stun'))addSt(f,'stun',1);
}
function hitFoe(f,mult,name){
  if(f.hp<=0)return 0;
  const el=foeEl(f);
  if(Math.random()*100<f.dg){floatOn(el,'промах','miss');Snd.sfx('miss');if(name)clog(`${name}: ${f.n} уклоняется`);return 0}
  let d=patk()*mult*rnd(.9,1.1);const cr=Math.random()*100<crit();if(cr)d*=1.75;
  d=Math.max(1,Math.round(d-f.def));f.hp=Math.max(0,f.hp-d);Snd.sfx(cr?'crit':'hit');
  floatOn(el,cr?d+'!':'-'+d,cr?'crit':'dmg');shakeEl(el);
  if(name)clog(`${name}: ${d}${cr?' (крит)':''} по цели ${f.n}`);
  tailCheck(f);procs(f,d);
  if(f.hp<=0)clog(`${f.n} повержен`);
  return d;
}
function magic(f,base,name){
  if(f.hp<=0)return 0;
  const d=Math.round(base*rnd(.9,1.1)*(C.cry?1+C.cry.p/2:1));f.hp=Math.max(0,f.hp-d);const el=foeEl(f);floatOn(el,'-'+d,'crit');shakeEl(el);Snd.sfx('crit');
  if(name)clog(`${name}: ${d} по цели ${f.n}`);tailCheck(f);if(f.hp<=0)clog(`${f.n} повержен`);return d;
}
const TAIL_PRICE=30;
function tailCheck(f){
  if(f.sk!=='tail'||f.tailLost)return;
  f.tailLost=true;S.tails=(S.tails||0)+1;C.tails++;
  const el=foeEl(f);el.querySelector('img').src=spriteURL('igu',{t:''});
  setTimeout(()=>floatOn(el,'хвост отпал!','heal'),250);
  clog('У игуаны отпал хвост! Вы подбираете трофей: хвост игуаны');
}
const alive=()=>C.foes.filter(f=>f.hp>0);
function act(id){
  if(!C||C.busy)return;
  const sk=SKB[id],r=rank(id);
  if(sk){if(!r||S.en<skCost(id))return;S.en-=skCost(id)}
  C.guard=null;
  const t=C.foes[C.tgt];
  switch(id){
    case'hit':{const d=hitFoe(t,1+.1*(r-1),'Удар');if(d&&r>=3&&Math.random()<.25)addSt(t,'bleed',3,Math.round(atk()*.3));if(r>=5&&t.hp>0&&Math.random()<.25)hitFoe(t,1+.1*(r-1),'Второй удар');break}
    case'rush':{const d=hitFoe(t,1.8+.15*(r-1),'Кровавый рывок');if(d&&r>=2)addSt(t,'bleed',3,Math.round(atk()*.35));break}
    case'bite':{const d=hitFoe(t,1.2+.1*(r-1),'Вампирский укус');if(d){let h=d*(.6+.1*(r-1));if(r>=5&&S.hp<maxHp()*.3)h*=2;heal(Math.round(h));if(r>=3)S.en=Math.min(maxEn(),S.en+4)}break}
    case'whirl':alive().forEach(f=>{const d=hitFoe(f,.8+.1*(r-1),null);if(d&&r>=3)addSt(f,'bleed',3,Math.round(atk()*.25));if(d&&r>=5&&Math.random()<.2)addSt(f,'stun',1)});clog('Вихрь клинков задевает всех врагов');break;
    case'stun':{const d=hitFoe(t,1.1+.1*(r-1),'Оглушающий удар');if(d&&Math.random()<.4+.1*(r-1)){addSt(t,'stun',1);clog(`${t.n} оглушён`)}if(d&&r>=4)addSt(t,'weak',2);break}
    case'seal':{const d=magic(t,12+S.wil*4+8*(r-1),'Тёмная печать');if(d&&r>=3)addSt(t,'weak',3);if(d&&r>=5)addSt(t,'burn',3,6+S.wil*2);break}
    case'fire':alive().forEach(f=>{magic(f,8+S.wil*2+6*(r-1),null);addSt(f,'burn',r>=4?5:3,4+S.wil+3*r)});clog('Огненная склянка поджигает врагов');break;
    case'cry':C.cry={t:r>=3?4:3,p:.25+.05*(r-1),c:r>=5?15:0};floatOn($('#cHero'),'клич!','en');clog(`Боевой клич: атака +${Math.round(C.cry.p*100)}%`);break;
    case'guard':C.guard={red:r>=5?.3:.5,counter:r>=3};S.en=Math.min(maxEn(),S.en+6+2*(r-1));floatOn($('#cHero'),`+${6+2*(r-1)} эн.`,'en');clog('Вы встаёте в защитную стойку');break;
    case'pot':if(!S.pots)return;S.pots--;heal(Math.round(maxHp()*.45));C.pois=null;clog('Вы пьёте зелье крови');break;
    case'elix':if(!S.elix)return;S.elix--;S.en=Math.min(maxEn(),S.en+Math.round(maxEn()*.6));floatOn($('#cHero'),'+эн.','en');clog('Эликсир возвращает силы');break;
    case'flee':if(C.boss)return;if(Math.random()*100<45+S.agi*2){endCombat('flee');return}clog('Сбежать не удалось');break;
  }
  if(!alive().length){C.busy=true;updCombat();setTimeout(()=>endCombat('win'),700);return}
  if(C.foes[C.tgt].hp<=0)C.tgt=C.foes.findIndex(f=>f.hp>0);
  enemyPhase();
}
function enemyPhase(){
  C.busy=true;updCombat();
  const list=alive();let i=0;
  const next=()=>{
    if(!C)return;
    if(i>=list.length){
      if(C.pois&&S.hp>0){const d=C.pois.d;S.hp=Math.max(1,S.hp-d);floatOn($('#cHero'),'-'+d+' яд','dot');if(--C.pois.t<=0)C.pois=null}
      if(C.cry&&--C.cry.t<=0){C.cry=null;clog('Боевой клич стихает')}
      C.busy=false;C.turn++;S.en=Math.min(maxEn(),S.en+3+gs('regen'));updCombat();return}
    const f=list[i++];
    if(f.hp>0){
      const el=foeEl(f);
      for(const k of['bleed','burn']){const s=f.st[k];if(!s)continue;f.hp=Math.max(0,f.hp-s.d);floatOn(el,'-'+s.d,'dot');if(--s.t<=0)delete f.st[k];if(f.hp<=0){clog(`${f.n} погибает от ${k==='bleed'?'кровотечения':'огня'}`);break}}
      if(f.hp>0){if(f.st.stun){delete f.st.stun;floatOn(el,'оглушён','miss');clog(`${f.n} пропускает ход`)}else foeAct(f);if(f.st.weak&&--f.st.weak<=0)delete f.st.weak}
    }
    updCombat();
    if(S.hp<=0){C.busy=true;setTimeout(()=>endCombat('lose'),800);return}
    if(!alive().length){setTimeout(()=>endCombat('win'),600);return}
    if(C.foes[C.tgt].hp<=0)C.tgt=C.foes.findIndex(x=>x.hp>0);
    setTimeout(next,420);
  };
  setTimeout(next,380);
}
function foeAct(f){
  f.turn++;
  const el=foeEl(f);el.style.transform='translateY(6px)';setTimeout(()=>el.style.transform='',160);
  let mult=1,ignore=false,verb='атакует',enDrain=0;
  const a=f.atk*(f.st.weak?.7:1);
  if(f.sk==='howl'&&f.turn%3===0){f.atk=Math.round(f.atk*1.2);clog(`${f.n} воет — его атака растёт`);return}
  if(f.sk==='prince'&&!f.moon&&f.hp<f.max/2){f.moon=true;f.atk=Math.round(f.atk*1.25);clog('Луна алеет: Князь впадает в ярость');return}
  if(f.sk==='rend'&&Math.random()<.25){mult=1.5;verb='рвёт когтями'}
  if(f.sk==='hex'&&Math.random()<.35){mult=.9;ignore=true;verb='насылает порчу'}
  if(f.sk==='frost'&&f.turn%3===0){mult=1.6;ignore=true;verb='обрушивает ледяную волну'}
  if(f.sk==='smash'&&f.turn%3===0){mult=1.8;verb='обрушивает дубину'}
  if(f.sk==='freeze'&&Math.random()<.25){mult=.9;ignore=true;enDrain=6;verb='дышит стужей'}
  if(f.sk==='qspit'&&f.turn%3===0){mult=1.7;ignore=true;verb='плюёт кислотой'}
  if(f.sk==='witch'&&f.turn%3===0){mult=1.6;ignore=true;enDrain=10;verb='насылает ледяную бурю'}
  if(f.sk==='drain'||f.sk==='prince')verb='пьёт вашу кровь';
  if(!ignore&&Math.random()*100<dodge()){floatOn($('#cHero'),'уклон','miss');Snd.sfx('miss');clog(`${f.n} промахивается`);return}
  let d=a*mult*rnd(.85,1.15);if(!ignore)d-=def();d=Math.max(1,Math.round(d));
  if(C.guard)d=Math.max(1,Math.round(d*C.guard.red));
  S.hp=Math.max(0,S.hp-d);floatOn($('#cHero'),'-'+d,'hurt');shakeEl($('#cHero'));Snd.sfx('hurt');
  if(enDrain)S.en=Math.max(0,S.en-enDrain);
  if(f.sk==='drain'||f.sk==='prince')f.hp=Math.min(f.max,f.hp+Math.round(d*.5));
  if((f.sk==='poison'&&Math.random()<.3)||(f.sk==='qspit'&&Math.random()<.4)){C.pois={t:3,d:Math.max(2,Math.round(a*.3))};clog('Вы отравлены')}
  clog(`${f.n} ${verb}: −${d}${enDrain?`, −${enDrain} эн.`:''}`);
  const th=gs('thorns');if(th&&S.hp>0){const r=Math.max(1,Math.round(d*th/100));f.hp=Math.max(0,f.hp-r);floatOn(el,'-'+r,'dot');if(f.hp<=0)clog(`${f.n} погибает на шипах`)}
  if(C.guard&&C.guard.counter&&f.hp>0&&S.hp>0)hitFoe(f,.5,'Контратака');
}
function levelUps(){let n=0;while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;S.pts+=3;S.sp++;n++}if(n){S.hp=maxHp();S.en=maxEn()}return n}
function endCombat(res){
  const c=C;if(!c)return;C=null;cEl.hidden=true;
  if(res==='flee'){const g=S.enemies.find(e=>e.uid===c.group);if(g)g.stun=4;anim={fx:S.x,fy:S.y,t0:performance.now()};S.x=S.prev.x;S.y=S.prev.y;toast('Вы отступили');updateHud();save();return}
  if(res==='lose'){
    Snd.sfx('lose');
    const lost=Math.floor(S.gold*.3);S.gold-=lost;const t=LOCS.find(l=>l.id===S.lastTown);
    S.x=t.x;S.y=t.y;anim={fx:S.x,fy:S.y,t0:0};S.hp=maxHp();S.en=maxEn();reveal();
    S.enemies.forEach(g=>{if(Math.abs(g.x-S.x)+Math.abs(g.y-S.y)<6)g.stun=6});
    save();
    openSheet('Вы пали',()=>`<div class="big"><div class="glyph">†</div><p>Местные нашли вас у дороги и принесли в поселение «${t.name}».${lost?` Пока вы лежали без сознания, пропало ${lost} золота.`:''}</p></div><button class="btn wide" data-act="close">Подняться</button>`,{noClose:true});
    return;
  }
  let xp=0,gold=0;const loot=[];
  for(const f of c.foes){xp+=f.xp;gold+=f.gold;
    if(!f.boss){S.kills[f.type]=(S.kills[f.type]||0)+1;onKill(f.type).forEach(m=>loot.push(`<span>${m}</span>`))}
    if(S.bounty&&S.bounty.type===f.type&&S.bounty.have<S.bounty.need)S.bounty.have++;
    if(!f.boss&&Math.random()<.11){const it=genItem(pick(SLOTS),f.lvl,rollRar(.1));const m=addItem(it);loot.push(m?`<span>${m}</span>`:`<span class="r${it.rar}">${itemName(it)}</span>`)}}
  xp=Math.round(xp*(1+gs('xp')/100));gold=Math.round(gold*(1+gs('gold')/100));
  if(c.tails)loot.push(`<span>Хвост игуаны${c.tails>1?' ×'+c.tails:''}</span>`);
  if(!c.boss){if(Math.random()<.3){S.pots++;loot.push('<span>Зелье крови</span>')}if(Math.random()<.12){S.elix++;loot.push('<span>Эликсир сумрака</span>')}}
  if(c.group)S.enemies=S.enemies.filter(g=>g.uid!==c.group);
  if(c.boss){S.bosses[c.boss]=true;const tr=BOSS[c.boss].tro;if(!S.trophies.includes(tr))S.trophies.push(tr);loot.push(`<span class="r3">${TROPHY[tr].n}</span>`);
    for(let i=0;i<2;i++){const it=genItem(pick(SLOTS),BOSS[c.boss].lvl,Math.random()<.35?3:2);const m=addItem(it);loot.push(m?`<span>${m}</span>`:`<span class="r${it.rar}">${itemName(it)}</span>`)}
    S.pots+=2;}
  S.xp+=xp;S.gold+=gold;const ups=levelUps();
  Snd.sfx('win');if(ups)setTimeout(()=>Snd.sfx('level'),900);
  if(c.boss==='prince'){S.won=true;save();
    openSheet('Рассвет',()=>`<div class="big"><div class="glyph">☼</div><p>Князь Ноктюрн рассыпается пеплом. Впервые за сто ночей луна бледнеет, и над Долиной поднимается солнце.</p><p class="lore">Вы победили. Можно продолжать странствовать: задания и враги ещё ждут.</p></div><div class="loot">${loot.join('')}</div><button class="btn wide" data-act="close">Встретить рассвет</button>`,{noClose:true});return}
  save();
  const readyQ=Object.keys(S.q).filter(qReady).map(q=>QUESTS[q]);
  openSheet(c.boss?'Великая победа':'Победа',()=>`<div class="loot"><span>+${xp} опыта</span><span class="price">+${gold} золота</span>${loot.join('')}</div>
   ${ups?`<p style="text-align:center"><b>Новый уровень: ${S.lvl}!</b> +${ups*3} очк. характеристик и +${ups} очк. навыков — раздел «Герой».</p>`:''}
   ${readyQ.length?`<p class="lore" style="text-align:center">Задание выполнено: ${readyQ.map(q=>`«${q.n}»`).join(', ')}. Вернитесь к тому, кто его дал.</p>`:''}
   ${S.bounty&&S.bounty.have>=S.bounty.need?'<p class="lore" style="text-align:center">Заказ с доски выполнен — сдайте его в поселении.</p>':''}
   <button class="btn wide" data-act="close">Дальше</button>`,{noClose:true});
}

/* ---------- music & sound (generated live with Web Audio, no files) ---------- */
const Snd=(()=>{
  const prefs={music:false,sfx:true,mvol:60,svol:65};
  try{Object.assign(prefs,JSON.parse(localStorage.getItem('ash-moon-audio')||'{}'))}catch(e){}
  const savePrefs=()=>{try{localStorage.setItem('ash-moon-audio',JSON.stringify(prefs))}catch(e){}};
  let ctx=null,musicBus,sfxBus,noiseBuf,timer=null,cur='explore',step=0,nextT=0,paused=false,wg=null;
  const gains={};
  /* recorded tracks (OpenGameArt, see credits in the menu). The synth below is only a fallback when a file can't load (offline). */
  // where to look for the tracks, in order: inside the Android app (bundled, works offline) -> the GitHub site -> built-in synth
  const ONLINE='https://lintger-laplas.github.io/ash-moon/music/';
  const SRCS=location.hostname==='ashmoon.app'?['music/',ONLINE]:location.hostname.endsWith('github.io')?['music/']:[ONLINE];
  const files={},failed={};
  function audioFor(name){
    if(failed[name])return null;
    if(!files[name]){const a=new Audio();a.preload='auto';a.loop=true;a.volume=0;let si=0;
      a.addEventListener('error',()=>{si++;if(si<SRCS.length){a.src=SRCS[si]+name+'.mp3';a.load()}else{failed[name]=true;try{a.pause()}catch(e){}}});
      a.src=SRCS[0]+name+'.mp3';files[name]=a}
    return files[name];
  }
  const fileLevel=()=>prefs.music&&!paused?Math.min(1,Math.pow(prefs.mvol/100,2)*1.2):0;
  let fader=null;
  function fade(){
    for(const n in files){const a=files[n];if(failed[n])continue;
      const target=n===cur?fileLevel():0,v=a.volume;
      if(target>0&&a.paused){if(v===0&&n!=='explore'&&n!=='town')try{a.currentTime=0}catch(e){}a.play().catch(()=>{})}
      a.volume=Math.abs(target-v)<.04?target:v+Math.sign(target-v)*.04;
      if(target===0&&a.volume===0&&!a.paused)a.pause();}
    if(wg)wg.gain.value=failed.explore?.07:0;
  }
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function impulse(sec,decay){const len=Math.floor(ctx.sampleRate*sec),b=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return b}
  function init(){
    if(ctx){if(ctx.state==='suspended'&&!paused)ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{ctx=new AC()}catch(e){return}
    const master=ctx.createGain();master.gain.value=.85;
    const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
    const rev=ctx.createConvolver();rev.buffer=impulse(3.4,2.6);const rg=ctx.createGain();rg.gain.value=.32;rev.connect(rg);rg.connect(master);
    musicBus=ctx.createGain();musicBus.gain.value=level('music');musicBus.connect(master);musicBus.connect(rev);
    sfxBus=ctx.createGain();sfxBus.gain.value=level('sfx');sfxBus.connect(master);const sr=ctx.createGain();sr.gain.value=.25;sfxBus.connect(sr);sr.connect(rev);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    for(const k in TR){gains[k]=ctx.createGain();gains[k].gain.value=k===cur?1:0;gains[k].connect(musicBus)}
    const wn=ctx.createBufferSource();wn.buffer=noiseBuf;wn.loop=true;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=1.4;
    const lfo=ctx.createOscillator();lfo.frequency.value=.06;const lg=ctx.createGain();lg.gain.value=260;lfo.connect(lg);lg.connect(bp.frequency);
    wg=ctx.createGain();wg.gain.value=0;wn.connect(bp);bp.connect(wg);wg.connect(gains.explore);wn.start();lfo.start();
    nextT=ctx.currentTime+.1;timer=setInterval(tick,25);
    audioFor(cur);audioFor('battle');fader=setInterval(fade,60);
  }
  function tick(){
    if(!ctx||ctx.state!=='running')return;
    const tr=TR[cur],spb=60/tr.bpm/4;
    if(!failed[cur]){nextT=ctx.currentTime+.05;return}
    if(nextT<ctx.currentTime-.2)nextT=ctx.currentTime+.05;
    while(nextT<ctx.currentTime+.15){try{tr.play(step,nextT,gains[cur],spb)}catch(e){}step++;nextT+=spb}
  }
  function setTrack(name){
    if(name===cur||!TR[name])return;
    const old=cur;cur=name;step=0;
    if(!ctx)return;
    audioFor(name);
    const now=ctx.currentTime;
    gains[old].gain.cancelScheduledValues(now);gains[old].gain.setTargetAtTime(0,now,.3);
    gains[name].gain.cancelScheduledValues(now);gains[name].gain.setTargetAtTime(1,now,.35);
    nextT=Math.max(nextT,now+.05);
  }
  function o(type,f,t,stop,out){const x=ctx.createOscillator();x.type=type;x.frequency.setValueAtTime(f,t);x.connect(out);x.start(t);x.stop(stop);return x}
  function vca(out,t,a,d,peak){const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);g.connect(out);return g}
  function lp(out,f,q=.7){const x=ctx.createBiquadFilter();x.type='lowpass';x.frequency.value=f;x.Q.value=q;x.connect(out);return x}
  function noise(t,dur,out){const s=ctx.createBufferSource();s.buffer=noiseBuf;s.connect(out);s.start(t,Math.random());s.stop(t+dur)}
  function pad(out,t,notes,dur,vol,cut=900){
    const g=ctx.createGain(),a=Math.min(1.2,dur*.35),sus=Math.max(t+a,t+dur-.25);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.setValueAtTime(vol,sus);g.gain.linearRampToValueAtTime(.0001,t+dur+.6);g.connect(out);
    const f=lp(g,cut);for(const m of notes)for(const dt of[-7,7]){o('sawtooth',mtof(m),t,t+dur+.7,f).detune.value=dt}
  }
  function pluck(out,t,m,vol,dec=.8,type='triangle'){o(type,mtof(m),t,t+dec+.05,lp(vca(out,t,.005,dec,vol),2600))}
  function bell(out,t,m,vol,dec=2.4){o('sine',mtof(m),t,t+dec,vca(out,t,.004,dec,vol));o('sine',mtof(m)*2.76,t,t+dec*.5,vca(out,t,.004,dec*.45,vol*.25))}
  function bass(out,t,m,dur,vol,cut=500){const g=vca(out,t,.01,dur,vol),f=ctx.createBiquadFilter();f.type='lowpass';f.Q.value=4;
    f.frequency.setValueAtTime(cut*2.2,t);f.frequency.exponentialRampToValueAtTime(cut,t+Math.min(.25,dur));f.connect(g);o('sawtooth',mtof(m),t,t+dur+.05,f)}
  function kick(out,t,vol){const g=vca(out,t,.002,.28,vol),x=o('sine',130,t,t+.3,g);x.frequency.exponentialRampToValueAtTime(38,t+.14)}
  function snare(out,t,vol){const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=1400;hp.connect(vca(out,t,.002,.16,vol));noise(t,.2,hp);o('triangle',190,t,t+.1,vca(out,t,.002,.07,vol*.6))}
  function hat(out,t,vol){const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=7500;hp.connect(vca(out,t,.001,.04,vol));noise(t,.06,hp)}
  function tom(out,t,m,vol){const x=o('sine',mtof(m)*1.6,t,t+.4,vca(out,t,.002,.35,vol));x.frequency.exponentialRampToValueAtTime(mtof(m),t+.2)}
  const AM=[[57,60,64],[53,57,60],[50,53,57],[52,56,59],[57,60,64],[48,52,55],[50,53,57],[52,56,59]];
  const TOWN=[[60,64,67],[55,59,62],[57,60,64],[53,57,60],[60,64,67],[53,57,60],[55,59,62],[55,59,62]];
  const pent=[69,72,74,76,79,81];
  function fight(cfg){return{bpm:cfg.bpm,play(s,t,out,spb){
    const bar=Math.floor(s/16)%4,i=s%16,r=cfg.roots[bar],ch=cfg.chords[bar];
    if(cfg.kicks.includes(i))kick(out,t,.55);
    if(i===4||i===12)snare(out,t,.28);
    if(i%2===0)hat(out,t,i%4?.035:.06);
    bass(out,t,r+cfg.pat[i],spb*.9,.11,cfg.cut);
    if(i===0)pad(out,t,ch.map(m=>m+12),spb*(cfg.organ?16:6),cfg.organ?.03:.04,1700);
    if(i===10&&!cfg.organ)pad(out,t,ch.map(m=>m+12),spb*4,.03,1700);
    if(cfg.organ&&i>=13)tom(out,t,r+12-(i-13)*3,.3);
    const riff=cfg.riff[bar];if(riff&&riff[i])pluck(out,t,riff[i],.045,.22,'square');
  }}}
  const TR={
    explore:{bpm:64,play(s,t,out,spb){
      const bar=Math.floor(s/16)%8,i=s%16,ch=AM[bar];
      if(i===0){pad(out,t,ch,spb*16,.045,650);bass(out,t,ch[0]-24,spb*15,.08,240)}
      if(i%4===0&&Math.random()<.75)pluck(out,t,ch[(i/4+bar)%3]+12,.06,1.3);
      if(i===10&&Math.random()<.4)bell(out,t,pick(pent),.045);
      if(i===6&&Math.random()<.25)pluck(out,t,ch[2]+24,.025,1.8,'sine');
    }},
    town:{bpm:82,play(s,t,out,spb){
      const bar=Math.floor(s/16)%8,i=s%16,ch=TOWN[bar];
      if(i===0){pad(out,t,ch,spb*16,.03,900);bass(out,t,ch[0]-24,spb*7,.07,300)}
      if(i===8)bass(out,t,ch[0]-24+7,spb*7,.05,300);
      if(i%2===0)pluck(out,t,ch[[0,1,2,1,0,2,1,2][i/2]]+12,.045,.7);
      if(i===12&&Math.random()<.5)bell(out,t,ch[2]+24,.03,1.6);
    }},
    battle:fight({bpm:138,cut:700,roots:[38,34,31,33],chords:[[62,65,69],[58,62,65],[55,58,62],[57,61,64]],
      kicks:[0,6,8,11],pat:[0,0,12,0,0,0,10,0,0,0,12,0,0,7,8,7],
      riff:[null,null,{0:74,3:72,4:70,6:67,8:70,10:74,12:72,14:70},{0:73,3:76,4:73,6:69,8:73,10:76,12:79,14:76}]}),
    boss:fight({bpm:150,cut:600,organ:true,roots:[38,39,38,36],chords:[[62,65,69],[63,67,70],[62,65,69],[60,63,67]],
      kicks:[0,4,8,10,12],pat:[0,0,12,0,1,0,12,0,0,0,13,0,1,0,12,1],
      riff:[{0:74,2:75,4:74,6:72,8:74,12:69},{0:75,2:74,4:75,6:79,8:78,12:75},{0:74,2:75,4:74,6:72,8:74,12:77},{0:72,2:75,4:79,6:84,8:79,12:75}]}),
  };
  const FX={
    hit(t){const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1300;bp.connect(vca(sfxBus,t,.002,.12,.5));noise(t,.15,bp);tom(sfxBus,t,40,.35)},
    crit(t){FX.hit(t);bell(sfxBus,t+.02,88,.12,.5)},
    miss(t){const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=2;bp.frequency.setValueAtTime(2500,t);bp.frequency.exponentialRampToValueAtTime(600,t+.18);bp.connect(vca(sfxBus,t,.02,.18,.3));noise(t,.22,bp)},
    hurt(t){kick(sfxBus,t,.5);const lpf=lp(vca(sfxBus,t,.002,.2,.35),900);noise(t,.22,lpf)},
    heal(t){const x=o('sine',520,t,t+.5,vca(sfxBus,t,.02,.45,.2));x.frequency.exponentialRampToValueAtTime(1250,t+.4);bell(sfxBus,t+.25,84,.06,1)},
    coin(t){bell(sfxBus,t,88,.08,.5);bell(sfxBus,t+.08,93,.08,.7)},
    win(t){[69,73,76,81].forEach((m,i)=>bell(sfxBus,t+i*.13,m,.12,1.6));pad(sfxBus,t+.5,[57,61,64,69],1.4,.05,1500)},
    level(t){[72,76,79,84,88].forEach((m,i)=>bell(sfxBus,t+i*.1,m,.11,1.8))},
    lose(t){pad(sfxBus,t,[45,48,52],2.2,.07,600);[64,60,57,52].forEach((m,i)=>bell(sfxBus,t+i*.32,m,.08,1.4))},
  };
  function sfx(name){if(!ctx||!prefs.sfx||ctx.state!=='running'||!FX[name])return;try{FX[name](ctx.currentTime+.01)}catch(e){}}
  // loudness curve: slider 0..100 -> gain 0..1.4 (squared so the low end is usable)
  function level(kind){if(!prefs[kind])return 0;const v=(kind==='music'?prefs.mvol:prefs.svol)/100;return v*v*1.4}
  function apply(kind){if(!ctx)return;const bus=kind==='music'?musicBus:sfxBus;bus.gain.setTargetAtTime(level(kind),ctx.currentTime,.12)}
  function toggle(kind){prefs[kind]=!prefs[kind];savePrefs();apply(kind);return prefs[kind]}
  let volT;
  function setVol(kind,v){prefs[kind==='music'?'mvol':'svol']=clamp(Math.round(v),0,100);apply(kind);clearTimeout(volT);volT=setTimeout(savePrefs,300)}
  function pause(){paused=true;if(ctx&&ctx.state==='running')ctx.suspend();for(const n in files){files[n].volume=0;try{files[n].pause()}catch(e){}}}
  function resume(){paused=false;if(ctx&&ctx.state==='suspended')ctx.resume()}
  document.addEventListener('visibilitychange',()=>document.hidden?pause():resume());
  window.addEventListener('pagehide',pause);
  window.__appPause=pause;window.__appResume=resume;
  ['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,init,{passive:true}));
  return{setTrack,sfx,toggle,setVol,prefs,info:()=>({state:ctx?ctx.state:'none',track:cur,step,files:Object.fromEntries(Object.entries(files).map(([n,a])=>[n,{vol:+a.volume.toFixed(2),paused:a.paused,ready:a.readyState,failed:!!failed[n]}]))})};
})();
function moodNow(){
  if(!$('#combat').hidden)return C&&C.boss?'boss':'battle';
  const l=locAt[S.y*W+S.x];return l&&l.type==='town'?'town':'explore';
}

/* ---------- boot ---------- */
function boot(saved){
  if(saved&&saved.explored)S=migrate(saved);else S=newState();
  genWorld(1337);
  const fresh=!saved||!saved.explored;
  if(fresh){S.eq.weapon=genItem('weapon',1,0,'rusty');S.eq.armor=genItem('armor',1,0,'jacket')}
  if(fresh||S.migrated){S.hp=maxHp();S.en=maxEn()}
  if(!S.enemies.length){for(let i=0;i<ENEMY_CAP;i++)spawnGroup(false);for(let i=0;i<14;i++)spawnGroup(false,START)}
  anim={fx:S.x,fy:S.y,t0:0};path=[];reveal();updateHud();updMusicBtn();
  if(S.intro){S.intro=false;openSheet('Пепельная Луна',()=>`<p class="lore">Сто ночей луна не заходит над Долиной Пепла. Она стала серой, как зола, и в её свете из могил встают мертвецы, а волки забывают страх.</p>
   <p>Говорят, всё началось, когда в замке на севере проснулся Князь Ноктюрн. Вы — охотник, который пришёл в Серый Брод, чтобы его остановить.</p>
   <p>Нажимайте на карту, чтобы идти. Цифра над врагом — его уровень. Люди со знаком «!» дают задания. Становитесь сильнее, собирайте снаряжение и идите на север.</p>
   <button class="btn wide" data-act="close">В путь</button>`,{noClose:true})}
  else if(S.migrated){openSheet('Долина изменилась',()=>`<p>Мир стал в несколько раз больше: пять поселений, ледяной север и гнилые топи, новые враги, шесть боссов и люди с заданиями.</p>
   <p>Ваш герой сохранил уровень, характеристики, золото, трофеи и победы. Старое оружие и доспех теперь в разделе «Герой → Снаряжение».</p>
   <p><b>Новое:</b> пять ячеек снаряжения, редкие вещи со свойствами, заточка в кузнице и прокачка навыков. За прошлые уровни вам начислено ${S.sp} очк. навыков.</p>
   <button class="btn wide" data-act="close">В путь</button>`,{noClose:true});delete S.migrated}
  save();
}
let started=false;
function start(data){
  if(started)return;started=true;
  boot((data&&data.S)||load());
  resize();window.addEventListener('resize',resize);
  requestAnimationFrame(loop);
}
try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

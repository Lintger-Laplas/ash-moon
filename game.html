<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Пепельная Луна</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Ruslan+Display&display=swap">
<style>
/* Layout: one-screen mobile RPG — HUD strip, full-bleed map canvas, bottom nav; sheets slide over it; side-view duel screen for combat. Single dark world by design. */
:root{
  --night:#0d0a11; --panel:#18121e; --panel2:#231a2b; --line:#3a2c44;
  --blood:#a3172b; --blood-hi:#e0384f; --bone:#ebe1cd; --muted:#9c90a6;
  --gold:#d9a441; --energy:#5b82ff; --xp:#9a6cf0; --ok:#8fbf6a;
  --r0:#cfc6b4; --r1:#6fa8ff; --r2:#c08bff; --r3:#ffa448;
  --f-display:"Ruslan Display","Philosopher",Georgia,serif;
  --f-body:"Philosopher","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--night)}
body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--bone);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input{font:inherit}
#app{height:100%;display:flex;flex-direction:column}
#hud{padding-block:8px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--panel),var(--night));border-bottom:1px solid var(--line)}
.hud-row{display:flex;align-items:center;gap:10px}
.lvl{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:radial-gradient(circle at 35% 30%,var(--blood-hi),var(--blood) 60%,#4a0812);box-shadow:0 0 0 2px #2a0a12,0 0 12px #a3172b66}
.bars{flex:1;display:grid;gap:4px;min-width:0}
.bar{position:relative;display:block;height:14px;border-radius:3px;background:#0a070d;border:1px solid var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .25s}
.bar.hp i{background:linear-gradient(var(--blood-hi),var(--blood))}
.bar.en i{background:linear-gradient(#86a2ff,var(--energy))}
.bar.xp{height:5px}.bar.xp i{background:var(--xp)}
.bar span{position:relative;display:block;font-size:11px;line-height:12px;text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.gold{flex:none;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:5px}
.gold::before{content:"";width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe29a,var(--gold) 55%,#7a5412)}
.mus{flex:none;position:relative;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:var(--panel2);color:var(--gold);font-size:17px;line-height:1}
.mus.off{border-color:var(--line);color:var(--muted)}
.mus.off::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:2px;background:var(--blood-hi);transform:rotate(-45deg)}
.vol{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.vol input{flex:1;min-width:0;accent-color:var(--blood-hi);height:28px}
.vol output{width:3.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--bone)}
.zone{margin-top:5px;font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.zone b{color:var(--bone);font-weight:400}
#view{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.joy{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(235,225,205,.28);background:radial-gradient(circle,rgba(235,225,205,.1),rgba(235,225,205,.02) 70%);pointer-events:none;z-index:5}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.55),rgba(224,56,79,.7) 60%,rgba(120,10,30,.8));box-shadow:0 0 16px rgba(224,56,79,.6)}
.actbtn{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;display:grid;justify-items:center;gap:1px;min-width:170px;max-width:calc(100% - 32px);padding:10px 22px;border-radius:12px;border:1px solid #c9a24a;background:linear-gradient(#5a1420ee,#2a0a12ee);color:#fff;box-shadow:0 6px 20px #000c,0 0 18px #e0384f55;animation:actin .25s ease-out}
.actbtn b{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.06em;color:#ffe2a8}
.actbtn span{font-size:12.5px;color:#e8d8c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.actbtn.npc{border-color:#8fdf6a;background:linear-gradient(#24401ced,#10200cee)}
.actbtn.shrine{border-color:#8fd0ff;background:linear-gradient(#1a3450ee,#0c1828ee)}
@keyframes actin{from{opacity:0;transform:translate(-50%,10px)}}
/* title screen */
.title{position:fixed;inset:0;z-index:50;background:#08060b;display:grid;place-items:center;overflow:hidden}
.tcontent{position:relative;z-index:1;width:100%;max-width:380px;display:grid;justify-items:center;gap:14px;padding-block:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.logo{display:grid;justify-items:center;line-height:.95;font-family:var(--f-display);color:#f3e6d0;text-shadow:0 0 24px #e0384f,0 0 4px #a3172b,0 3px 6px #000;animation:logoIn 1.2s ease-out}
.logo span:first-child{font-size:clamp(30px,10vw,46px);letter-spacing:.06em}
.logo span:last-child{font-size:clamp(46px,16vw,74px);color:#ff9aa8;letter-spacing:.08em}
@keyframes logoIn{from{opacity:0;transform:translateY(-14px) scale(.96);filter:blur(4px)}}
.tsub{margin:0;text-align:center;color:#cdbfd2;font-style:italic;font-size:14px;text-shadow:0 1px 3px #000}
.tmenu{width:100%;display:grid;gap:10px;margin-top:10px}
.tbtn{width:100%;padding:14px;border-radius:10px;border:1px solid #6b3a44;background:linear-gradient(#2a1620e6,#160c12e6);color:#f3e6d0;font-family:var(--f-display);font-size:18px;letter-spacing:.06em;box-shadow:0 4px 14px #000a}
.tbtn.main{border-color:#c9a24a;background:linear-gradient(#8a1d31,#4a0c1a);color:#fff}
.tbtn:disabled{opacity:.35}
.tbtn small{display:block;font-family:var(--f-body);font-size:12px;letter-spacing:0;color:#cdbfd2;margin-top:2px}
.tpanel{width:100%;display:grid;gap:10px;padding:14px;border-radius:12px;background:#140e18ee;border:1px solid var(--line)}
.tpanel p{margin:0;color:#d8cdbb;line-height:1.45}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:8px 14px;border-radius:6px;background:#18121ee8;border:1px solid var(--line);font-size:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;z-index:40}
#toast.on{opacity:1}
#nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--night),var(--panel));border-top:1px solid var(--line)}
#nav button{position:relative;padding:11px 2px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:14px;letter-spacing:.03em}
#nav button:active{background:var(--line)}
.dot{position:absolute;top:5px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--blood-hi);box-shadow:0 0 8px var(--blood-hi)}
.dot.q{background:var(--gold);box-shadow:0 0 8px var(--gold)}

/* sheets */
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:#05030880;padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
.sheet{width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -10px 40px #000a;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet-head{display:flex;align-items:center;gap:12px;padding-block:14px 10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;margin:0;font-family:var(--f-display);font-weight:400;font-size:21px;letter-spacing:.02em;text-wrap:balance;color:var(--bone)}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-size:20px;line-height:1}
.sheet-body{overflow-y:auto;padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px;grid-auto-rows:max-content;align-content:start}
.sheet-body p{margin:0;line-height:1.5;color:#d8cdbb}
.lore{font-style:italic;color:var(--muted)!important}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:max-content;flex:none;position:sticky;top:-14px;z-index:2;background:var(--panel);padding-block:4px;margin-block:-4px}
.tabs button{flex:1 0 auto;white-space:nowrap;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--bone);border-color:var(--blood)}
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:700}
.row .t small{color:var(--muted);font-size:13px}
.row img.ic{width:40px;flex:none;image-rendering:pixelated}
.btns{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.btn{padding:9px 14px;border-radius:6px;border:1px solid #6b1422;background:linear-gradient(#b81f35,#7f1022);color:#fff;font-weight:700;white-space:nowrap}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--bone);font-weight:400}
.btn.wide{width:100%;padding:13px}
.tag{font-size:12px;color:var(--muted);white-space:nowrap}
.tag.eq{color:var(--ok)}
.up{color:var(--ok)}.down{color:#e06a6a}
.price{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
h3{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-size:15px;letter-spacing:.06em;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.stat .t{flex:1}.stat .t small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.plus{width:30px;height:30px;border-radius:50%;border:1px solid #6b1422;background:var(--blood);color:#fff;font-size:18px;line-height:1}
.derived{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:13px;color:var(--muted)}
.derived span b{display:block;color:var(--bone);font-size:17px;font-variant-numeric:tabular-nums}
.quest{padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);display:grid;gap:5px}
.quest.done{opacity:.5}.quest.cur{border-color:var(--blood)}.quest.ready{border-color:var(--ok)}
.quest b{font-size:16px}.quest small{color:var(--muted);line-height:1.4}
.prog{height:6px;border-radius:3px;background:#0a070d;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}
.big{text-align:center;display:grid;gap:8px;justify-items:center}
.big .glyph{font-family:var(--f-display);font-size:44px;color:var(--blood-hi);text-shadow:0 0 20px #a3172b}
.loot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.loot span{padding:6px 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}
.row.rb1{border-color:#2c4a7a}.row.rb2{border-color:#5a3a82}.row.rb3{border-color:#8a5420}
.lines{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.mm{width:100%;max-width:520px;aspect-ratio:1;border-radius:10px;justify-self:center;background:#050308;box-shadow:0 6px 24px #000a}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* character creation & picks */
.cards{display:grid;gap:8px}
.card{display:grid;gap:4px;text-align:left;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.card b{font-size:16px}.card small{color:var(--muted);line-height:1.4}.card .bon{color:var(--gold);font-size:13px}.card .pas{color:#c8b8ff;font-size:13px}
.card.on{border-color:var(--blood-hi);box-shadow:0 0 0 1px var(--blood-hi),0 0 16px #e0384f33}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.sw.on{border-color:var(--bone);box-shadow:0 0 0 2px var(--blood-hi)}
.namein{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:#0f0b13;color:var(--bone);font-size:16px}
.portrait{display:flex;gap:14px;align-items:center}
.portrait .pimg{width:96px;height:96px;flex:none;border-radius:12px;border:1px solid var(--line);background:radial-gradient(circle at 50% 30%,#3a1824,#120c16);display:grid;place-items:center}
.portrait .pimg img{width:80px;image-rendering:pixelated}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--blood-hi)}

/* paper doll */
.doll{display:grid;grid-template-columns:62px 1fr 62px;gap:8px;align-items:start}
.dcol{display:grid;gap:8px}
.slot{position:relative;width:62px;height:62px;border-radius:8px;border:1px solid var(--line);background:#120c16;display:grid;place-items:center;padding:0}
.slot img{width:44px;image-rendering:pixelated}
.slot .sl{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted);letter-spacing:.04em}
.slot.b1{border-color:#3b6ab0}.slot.b2{border-color:#8a5ad8}.slot.b3{border-color:#e08a2a}
.slot.sel{box-shadow:0 0 0 2px var(--bone)}
.slot .up{position:absolute;top:2px;right:4px;font-size:10px;color:var(--gold)}
.dmid{display:grid;justify-items:center;gap:6px;align-self:stretch;border-radius:10px;background:radial-gradient(ellipse at 50% 35%,#2e1520,#120c16 75%);border:1px solid var(--line);padding:10px 6px}
.dmid img{width:min(150px,100%);image-rendering:pixelated}
.dmid .bars{width:100%}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.bag .slot{width:100%;height:auto;aspect-ratio:1}
.bag .slot img{width:70%}
.ipanel{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;gap:8px}
.ipanel .btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* bloodline trees */
.branches{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.branches button{padding:8px 4px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;line-height:1.2}
.branches button b{display:block;color:var(--bone);font-size:14px}
.branches button.on{border-color:var(--blood-hi);background:var(--panel2)}
.tier{display:grid;gap:8px;padding:10px;border-radius:10px;border:1px dashed var(--line)}
.tier.lock{opacity:.5}
.tier h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
.node{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.node .rk{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums;border:2px solid #4a3a52;background:radial-gradient(circle,#2a1a2e,#120c16)}
.node.has .rk{border-color:var(--blood-hi);box-shadow:0 0 10px #e0384f55}
.node.act .rk{border-radius:10px}
.node .t{flex:1;min-width:0}.node .t b{display:block}.node .t small{color:var(--muted);font-size:12.5px;line-height:1.35}

/* combat: side-view duel */
.combat{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--night);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cbars{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding-block:8px 6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:linear-gradient(#0d0a11,#0d0a11cc)}
.cb{flex:1;min-width:0;display:grid;gap:3px}
.cb .nm{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb.r{text-align:right}.cb.r .bar i{inset:0 0 0 auto}
.cmid{flex:none;display:grid;justify-items:center;gap:3px;padding-top:2px}
.moons{display:flex;gap:4px}
.moon{width:15px;height:15px;border-radius:50%;border:1px solid #8a7a6a;background:#0a070d}
.moon.f{background:radial-gradient(circle at 35% 35%,#fff6d0,#d9b04a);box-shadow:0 0 8px #d9b04a99}
.cturn{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.scene{position:relative;flex:1;min-height:150px;overflow:hidden;--sky1:#17121f;--sky2:#2a2232;--gr1:#2e2b26;--gr2:#1a1814;background:linear-gradient(var(--sky1),var(--sky2) 52%,var(--gr1) 52.2%,var(--gr2))}
.scene.snow{--sky1:#7d8a9a;--sky2:#c4ccd6;--gr1:#dfe6ec;--gr2:#a8b4c0}
.scene.swamp{--sky1:#101a16;--sky2:#22302a;--gr1:#263420;--gr2:#121a10}
.scene.town{--sky1:#1c1418;--sky2:#3a2a26;--gr1:#3e3228;--gr2:#221a14}
.scene.boss{--sky1:#2a0710;--sky2:#4a1420;--gr1:#2a2026;--gr2:#140e12}
img{image-rendering:auto!important}
.scbg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fogband{position:absolute;left:-20%;right:-20%;top:44%;height:22%;background:radial-gradient(ellipse at 30% 50%,rgba(200,190,220,.14),transparent 60%),radial-gradient(ellipse at 75% 50%,rgba(200,190,220,.1),transparent 55%);animation:drift 14s ease-in-out infinite alternate;pointer-events:none;z-index:1}
@keyframes drift{to{transform:translateX(8%)}}
.scene.shake{animation:shake .32s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
/* weapon swings: the arm (with its weapon) is a separate layer that rotates around the shoulder */
.hbody{position:relative}
.hbody img{display:block}
.harm{position:absolute;left:0;top:0;width:100%;transform-origin:62% 38%}
.hero-fig.step{animation:step .5s ease-out}
@keyframes step{25%{transform:translateX(-8px)}55%{transform:translateX(34px)}100%{transform:none}}
.harm.sw-sword{animation:swSword .44s ease-out}
@keyframes swSword{0%{transform:none}35%{transform:rotate(-78deg)}62%{transform:rotate(72deg)}100%{transform:none}}
.harm.sw-katana{animation:swKatana .34s ease-out}
@keyframes swKatana{0%{transform:none}25%{transform:rotate(-45deg)}55%{transform:rotate(100deg)}100%{transform:none}}
.harm.sw-axe,.harm.sw-hammer,.harm.sw-club{animation:swHeavy .6s cubic-bezier(.5,0,.3,1)}
@keyframes swHeavy{0%{transform:none}45%{transform:rotate(-118deg)}70%{transform:rotate(78deg)}100%{transform:none}}
.harm.sw-mace{animation:swMace .5s ease-out}

<script>
"use strict";
const $=s=>document.querySelector(s);
const W=80,H=80,SAVE_KEY='ash-moon-save-v1',SAVE_VER=5,START={x:10,y:70};
const T_GRASS=0,T_FOREST=1,T_MOUNT=2,T_WATER=3,T_ROAD=4;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const f1=v=>(Math.round(v*100)/100).toString().replace('.',',');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- art: painted vector figures, props and icons (drawn once, cached) ---------- */
const sprCache={},urlCache={};
let X=null;
const PI=Math.PI,METAL='#c8ced8',WOOD='#6a4428',GOLD='#d9b04a';
function shade(hex,a){
  if(!hex||hex[0]!=='#')return hex||'#000';
  let n=parseInt(hex.slice(1),16);if(hex.length===4)n=parseInt(hex.slice(1).split('').map(ch=>ch+ch).join(''),16);
  const t=a>0?255:0,p=Math.abs(a),m=v=>Math.round(v+(t-v)*p);
  return`rgb(${m(n>>16&255)},${m(n>>8&255)},${m(n&255)})`;
}
function lg(y0,y1,c,a=.25,b=-.38){const g=X.createLinearGradient(0,y0,0,y1);g.addColorStop(0,shade(c,a));g.addColorStop(.5,c);g.addColorStop(1,shade(c,b));return g}
function lgx(x0,x1,c,a=.35,b=-.3){const g=X.createLinearGradient(x0,0,x1,0);g.addColorStop(0,shade(c,b));g.addColorStop(.55,c);g.addColorStop(1,shade(c,a));return g}
function rg(cx,cy,r,c){const g=X.createRadialGradient(cx-r*.35,cy-r*.4,r*.05,cx,cy,r*1.08);g.addColorStop(0,shade(c,.38));g.addColorStop(.55,c);g.addColorStop(1,shade(c,-.5));return g}
function trace(pts){X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++){const p=pts[i];p.length===4?X.quadraticCurveTo(p[0],p[1],p[2],p[3]):X.lineTo(p[0],p[1])}}
function P(pts,fill){trace(pts);X.closePath();X.fillStyle=fill;X.fill()}
function E(cx,cy,rx,ry,fill,rot=0){X.beginPath();X.ellipse(cx,cy,Math.max(.1,rx),Math.max(.1,ry),rot,0,PI*2);X.fillStyle=fill;X.fill()}
function Ln(pts,w,c){X.lineCap='round';X.lineJoin='round';X.strokeStyle=c;X.lineWidth=w;trace(pts);X.stroke()}
function limb(pts,w,c){Ln(pts,w+1.4,shade(c,-.6));Ln(pts,w,c);X.globalAlpha=.32;Ln(pts.map(p=>p.map(v=>v-w*.2)),w*.32,shade(c,.5));X.globalAlpha=1}
function glow(cx,cy,r,c,a=.8){const g=X.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');X.save();X.globalAlpha=a;X.fillStyle=g;X.fillRect(cx-r,cy-r,r*2,r*2);X.restore()}
function eyeG(x,y,c,r=1.4){glow(x,y,r*4.5,c,.55);E(x,y,r,r*.85,shade(c,.35))}

/* weapons: local space, grip at (0,0), blade pointing up */
function weaponArt(wt,o={}){
  switch(wt){
    case'sword':Ln([[0,6],[0,-2]],3.2,'#3a2418');P([[-6,-2],[6,-2],[6,-4.5],[-6,-4.5]],lg(-5,-2,GOLD));P([[-1.9,-4.5],[1.9,-4.5],[1.6,-32],[0,-37],[-1.6,-32]],lgx(-2,2,METAL));Ln([[0,-7],[0,-31]],.6,'rgba(255,255,255,.55)');E(0,7,1.8,1.8,GOLD);break;
    case'dagger':Ln([[0,5],[0,-1]],3,'#2a1a12');P([[-4,-1],[4,-1],[4,-3],[-4,-3]],lg(-3,-1,GOLD));P([[-1.7,-3],[1.7,-3],[1.2,-15],[0,-19],[-1.2,-15]],lgx(-2,2,METAL));break;
    case'axe':Ln([[0,8],[0,-30]],3,WOOD);P([[1,-28],[11,-34,14,-25],[12,-16],[1,-20]],lgx(1,14,METAL));Ln([[13.4,-32],[13,-17]],.8,'rgba(255,255,255,.5)');break;
    case'mace':Ln([[0,8],[0,-22]],3,WOOD);for(let i=0;i<8;i++){const a=i/8*PI*2;P([[Math.cos(a)*4,-27+Math.sin(a)*4],[Math.cos(a+.25)*8.5,-27+Math.sin(a+.25)*8.5],[Math.cos(a+.5)*4,-27+Math.sin(a+.5)*4]],'#6a707a')}E(0,-27,5.5,5.5,rg(0,-27,5.5,'#8a909a'));break;
    case'hammer':Ln([[0,14],[0,-36]],3.4,WOOD);P([[-9,-36],[9,-36],[9,-47],[-9,-47]],lg(-47,-36,'#8a909a'));P([[-9,-39],[9,-39],[9,-36],[-9,-36]],'#4a4e56');break;
    case'spear':Ln([[0,16],[0,-50]],2.6,WOOD);P([[-3,-50],[3,-50],[0,-64]],lgx(-3,3,METAL));P([[-3.5,-50],[3.5,-50],[3,-47.5],[-3,-47.5]],GOLD);break;
    case'katana':Ln([[0,7],[0,-1]],2.8,'#1a1010');E(0,-1.5,4,1.4,GOLD);P([[-1.3,-2],[3,-20,7,-37],[8.2,-36],[4.5,-20,1.4,-2]],lgx(-1,8,'#e8ecf2'));break;
    case'staff':Ln([[0,16],[-1,-50]],3,'#4a2e1a');Ln([[-4.5,-48],[-1,-55],[2.5,-48]],1.6,GOLD);eyeG(-1,-55,o.orb||'#ff3a5a',3.2);break;
    case'scythe':Ln([[0,14],[0,-46]],3,'#3a2414');P([[0,-46],[-20,-50,-30,-36],[-18,-44,0,-41]],lgx(-30,0,METAL));break;
    case'club':P([[-2,8],[2,8],[6.5,-28],[0,-35],[-6.5,-28]],lg(-35,8,'#6a4a2a'));E(2,-20,1.6,1,'#4a3018');E(-2.5,-11,1.2,.9,'#4a3018');break;

function rollRar(luck=0){const x=Math.random();return x<.02+luck*.04?3:x<.12+luck*.15?2:x<.42+luck*.2?1:0}
function genItem(cat,lvl,rar,baseId){
  lvl=clamp(Math.round(lvl),1,20);
  let b;
  if(baseId)b=BASE_BY[baseId];
  else{const list=BASES[cat].filter(x=>x.lv<=lvl);b=list[Math.max(0,list.length-1-Math.floor(Math.random()*Math.min(3,list.length)))]}
  const r=rar==null?rollRar():rar;
  const it={uid:S.uid++,cat:b.cat||cat,base:b.id,lvl:Math.max(lvl,b.lv),rar:r,up:0,aff:{}};
  const sc=(1+(it.lvl-b.lv)*.06)*(r===3?1.25:1);
  for(const k of['atk','def','hp','en'])if(b[k])it[k]=Math.max(1,Math.round(b[k]*sc));
  if(b.imp)for(const k in b.imp)it.aff[k]=b.imp[k];
  const pool=CAT_AFF[it.cat].slice();
  for(let i=0;i<RAR[r].aff&&pool.length;i++){const k=pool.splice(Math.floor(Math.random()*pool.length),1)[0];it.aff[k]=(it.aff[k]||0)+Math.max(1,Math.round(AFF[k].f(it.lvl)*rnd(.75,1.15)))}
  if(r===3)it.name=pick(LEG_NAMES);
  return it;
}
const itemBase=it=>BASE_BY[it.base]||{n:'?',cat:it.cat};
const itemName=it=>(it.name||itemBase(it).n)+(it.up?` +${it.up}`:'');
const isTwo=it=>it&&it.cat==='weapon'&&!!(WT[itemBase(it).wt]||{}).two;
function itemStat(it,k){if(!it)return 0;let v=it.aff[k]||0;if(it[k])v+=Math.round(it[k]*(1+.08*it.up));return v}
const itemPrice=it=>Math.round((15+it.lvl*10)*RAR[it.rar].m*(1+.25*it.up));
const sellPrice=it=>Math.round(itemPrice(it)*.3);
function power(it){if(!it)return 0;let p=itemStat(it,'atk')*3+itemStat(it,'def')*3+itemStat(it,'hp')/4+itemStat(it,'en')/2;for(const k in it.aff)if(!['atk','def','hp','en'].includes(k))p+=it.aff[k]*2;return p}
function itemIcon(it){const b=itemBase(it);return it.cat==='weapon'?'i_'+(b.wt||'sword'):'i_'+it.cat}
function itemLines(it){
  const out=[];for(const k of['atk','def','hp','en']){const v=itemStat(it,k);if(v)out.push(`${AFF[k].n} +${v}`)}
  for(const k in it.aff)if(!['atk','def','hp','en'].includes(k))out.push(`${AFF[k].n} +${it.aff[k]}${AFF[k].u}`);
  return out.join(' · ');
}
function itemSub(it){const b=itemBase(it);return(it.cat==='weapon'?`${WT[b.wt].n}${isTwo(it)?', двуручное':''}`:CAT_N[it.cat])+` · ур. ${it.lvl} · ${RAR[it.rar].n}`}
function itemHTML(it,extra=''){return`<b class="r${it.rar}">${esc(itemName(it))}</b><small>${itemSub(it)}${extra}</small><span class="lines">${itemLines(it)}</span>`}
function compareTo(it){
  if(it.cat==='ring')return Math.min(power(S.eq.ring),power(S.eq.ring2));
  if(it.cat==='weapon')return power(S.eq.main);
  if(it.cat==='shield')return S.eq.off&&S.eq.off.cat==='shield'?power(S.eq.off):0;
  return power(S.eq[it.cat]);
}

function addItem(it){if(S.inv.length>=INV_MAX){const g=sellPrice(it);S.gold+=g;return`${itemName(it)} продан за ${g} (рюкзак полон)`}S.inv.push(it);return null}

/* ---------- world ---------- */
let tiles,dangerMap,biomeMap,locAt={};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genWorld(seed){
  const R=mulberry32(seed);
  const lattice=n=>{const g=[];for(let i=0;i<(n+2)*(n+2);i++)g.push(R());return g};
  const sm=t=>t*t*(3-2*t);
  const noise=(g,n,x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),u=sm(x-xi),v=sm(y-yi),at=(i,j)=>g[j*(n+2)+i];
    const a=at(xi,yi),b=at(xi+1,yi),c=at(xi,yi+1),d=at(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
  const n1=9,n2=20,g1=lattice(n1),g2=lattice(n2),m1=lattice(n1);
  tiles=new Uint8Array(W*H);dangerMap=new Uint8Array(W*H);biomeMap=new Uint8Array(W*H);locAt={};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const h=noise(g1,n1,x/W*n1,y/H*n1)*.7+noise(g2,n2,x/W*n2,y/H*n2)*.3;
    const m=noise(m1,n1,x/W*n1,y/H*n1);
    const edge=Math.min(x,y,W-1-x,H-1-y);
    let t=h<.33?T_WATER:h>.7?T_MOUNT:m>.52?T_FOREST:T_GRASS;
    if(edge<1)t=T_MOUNT;
    const k=y*W+x;tiles[k]=t;
    dangerMap[k]=clamp(1+Math.floor(Math.hypot(x-START.x,y-START.y)/5),1,20);
    biomeMap[k]=(x<46&&y<26)?1:(x>50&&y>46&&y<77)?2:0;
  }
  const L=id=>LOCS.find(l=>l.id===id);
  const carve=(a,b)=>{let x=a.x,y=a.y;
    while(x!==b.x||y!==b.y){const dx=b.x-x,dy=b.y-y;let hz=Math.abs(dx)>Math.abs(dy);if(dx&&dy&&R()<.3)hz=!hz;
      if(hz)x+=Math.sign(dx);else y+=Math.sign(dy);tiles[y*W+x]=T_ROAD}};
  for(const[a,b]of ROADS)carve(L(a),L(b));
  const towns=LOCS.filter(l=>l.type==='town');
  for(const l of LOCS)if(l.type==='npc'||l.type==='shrine'){
    let best=towns[0],bd=1e9;for(const t of towns){const d=Math.abs(t.x-l.x)+Math.abs(t.y-l.y);if(d<bd){bd=d;best=t}}
    carve(l,best);
  }
  for(const l of LOCS){
    const r=(l.type==='town'||l.type==='boss')?2:1;
    for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const x=l.x+i,y=l.y+j;if(x<1||y<1||x>W-2||y>H-2)continue;const k=y*W+x;if(tiles[k]===T_WATER||tiles[k]===T_MOUNT)tiles[k]=T_GRASS}
    tiles[l.y*W+l.x]=T_ROAD;locAt[l.y*W+l.x]=l;
  }
}

function groupTypes(L,bio){
  const pool=[];for(const k in EN){const d=EN[k];if(d.min>L||d.max<L)continue;const w=d.bio?(d.bio===bio?5:0.3):1;pool.push([k,w])}

function spawnGroup(far,near){
  for(let tries=0;tries<300;tries++){
    let x,y;
    if(near){x=near.x+Math.round(rnd(-16,16));y=near.y+Math.round(rnd(-16,16));if(x<1||y<1||x>W-2||y>H-2)continue}

    if(!passable(x,y)||locAt[y*W+x])continue;
    if(LOCS.some(l=>Math.abs(l.x-x)+Math.abs(l.y-y)<(l.type==='town'?4:2)))continue;

    const L=clamp(danger(x,y)+(Math.random()<.2?1:0),1,20);
    S.enemies.push({uid:S.uid++,x,y,fx:x+.5,fy:y+.5,L,types:groupTypes(L,biomeMap[y*W+x]),stun:0,face:Math.random()<.5?1:-1});

function tileRGB(t,b,h,dg){

  {const mv=S.moving,ph=ts/105,bob=mv?-Math.abs(Math.sin(ph))*T*.08:Math.sin(ts/600)*T*.01,tilt=mv?Math.sin(ph)*.07:0;
   ctx.save();ctx.translate(hx+T/2,hy+T*.97);ctx.rotate(tilt);ctx.scale(S.face<0?-1:1,mv?1-Math.abs(Math.cos(ph))*.04:1);

function bfs(tx,ty){
  if(!passable(tx,ty)||!S.explored[ty*W+tx])return null;
  const prev=new Int32Array(W*H).fill(-1),start=S.y*W+S.x,goal=ty*W+tx;prev[start]=start;

    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy,n=ny*W+nx;
      if(!passable(nx,ny)||prev[n]!==-1||!S.explored[n])continue;
      if(locAt[n]&&n!==goal)continue;

  }
  if(prev[goal]===-1)return null;
  const out=[];let c=goal;while(c!==start){out.unshift({x:c%W,y:(c/W)|0});c=prev[c]}

}

/* collision: a body of radius r may stand where all four corners are on walkable tiles (enemies also keep out of places) */
function freeAt(x,y,r,enemy){
  for(const[cx,cy]of[[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r]]){const tx=Math.floor(cx),ty=Math.floor(cy);
    if(!passable(tx,ty))return false;if(enemy&&locAt[ty*W+tx])return false}
  return true;
}
function slide(o,kx,ky,dx,dy,r,enemy){let moved=0;
  if(dx&&freeAt(o[kx]+dx,o[ky],r,enemy)){o[kx]+=dx;moved+=Math.abs(dx)}
  if(dy&&freeAt(o[kx],o[ky]+dy,r,enemy)){o[ky]+=dy;moved+=Math.abs(dy)}
  return moved}

function updateWorld(dt,ts){
  /* hero */
  let vx=0,vy=0;

  if(keys.l)vx-=1;if(keys.r)vx+=1;if(keys.u)vy-=1;if(keys.d)vy+=1;
  {const L=Math.hypot(vx,vy);if(L>1){vx/=L;vy/=L}}
  S.moving=Math.hypot(vx,vy)>.08;
  if(S.moving){
    if(Math.abs(vx)>.12)S.face=vx>0?1:-1;
    const moved=slide(S,'px','py',vx*HERO_SPEED*dt,vy*HERO_SPEED*dt,.28,false);
    S.walk=(S.walk||0)+moved;while(S.walk>=1){S.walk-=1;stepTick()}
    if(ts-dustT>170&&moved){dustT=ts;dust.push({x:S.px,y:S.py+.32,t:ts})}
    const tx=Math.floor(S.px),ty=Math.floor(S.py);
    if(tx!==S.x||ty!==S.y){S.prev={x:S.x,y:S.y};S.x=tx;S.y=ty;reveal();onTile();if(busy())return}
  }
  /* enemies wander, and chase when they see you */
  for(const g of S.enemies){
    const d=Math.hypot(S.px-g.fx,S.py-g.fy);
    if(d>20)continue;

let npcFrom=false;
function openNpc(id,fromTown){
  npcFrom=!!fromTown;const n=NPCS[id];

function npcBody(id){
  const n=NPCS[id];
  let h=`<div class="row"><img class="ic" src="${spriteURL('npc',n.pal)}" alt=""><div class="t"><p class="lore">«${n.hello}»</p></div></div>`;
  for(const q of Object.keys(QUESTS).filter(q=>QUESTS[q].g===id)){
    const Q=QUESTS[q],sq=S.q[q];
    if(sq&&sq.st==='done'){h+=`<div class="quest done"><b>✓ ${Q.n}</b></div>`;continue}
    if(sq){const pr=qProgress(q),need=qNeed(q),ready=pr>=need;
      h+=`<div class="quest ${ready?'ready':'cur'}"><b>${Q.n}</b><small>${Q.t}</small><small>Прогресс: ${pr} / ${need}${Q.k==='collect'?` (${Q.item})`:''}. Награда: ${rewardText(Q.r)}</small><div class="prog"><i style="width:${pr/need*100}%"></i></div>
       ${ready?`<button class="btn wide" data-act="turnIn" data-arg="${q}">Сдать задание</button>`:''}</div>`;continue}
    if(!qAvail(q))continue;
    if(S.lvl<Q.lv){h+=`<div class="quest"><b>${Q.n}</b><small>Приходи, когда окрепнешь (уровень ${Q.lv}).</small></div>`;continue}
    h+=`<div class="quest cur"><b>${Q.n}</b><small>${Q.t}</small><small>Награда: ${rewardText(Q.r)}</small><button class="btn wide" data-act="takeQ" data-arg="${q}">Принять задание</button></div>`;
  }
  if(n.shop)h+=`<h3>Товары</h3>${shopRows('trader',1.3)}`;
  h+=npcFrom?`<button class="btn ghost wide" data-act="backTown">Назад</button>`:`<button class="btn ghost wide" data-act="close">Уйти</button>`;
  return h;
}
ACT.takeQ=q=>{if(!qAvail(q))return;S.q[q]={st:'active',have:0};toast(`Задание принято: ${QUESTS[q].n}`)};
ACT.turnIn=q=>{
  if(!qReady(q))return;const Q=QUESTS[q],r=Q.r;S.q[q].st='done';
  if(Q.k==='have')S.tails-=Q.c;
  if(r.gold)S.gold+=r.gold;if(r.xp)S.xp+=r.xp;if(r.sp)S.tp+=r.sp*2;if(r.pts)S.lvq+=r.pts;if(r.pots)S.pots+=r.pots;if(r.elix)S.fpots+=r.elix;
  let got='';if(r.item){const it=genItem(r.item[0],Math.max(S.lvl,Q.lv)+1,r.item[1]);const m=addItem(it);got=m||` Получено: ${itemName(it)}.`}
  const u=levelUps();Snd.sfx(u?'level':'win');
  toast(`Задание выполнено!${got}${u?' Новый уровень!':''}`);
};

    h+=`<button class="btn ghost wide" data-act="resetTree" ${!any||S.gold<cost?'disabled':''}>Сбросить все линии — ${cost} золота</button>`;
  }else{
    h+=`<div class="rows">
     <div class="row"><div class="t"><b>Зелье здоровья × ${S.pots}</b><small>Лечит 40% здоровья</small></div><button class="btn" data-act="usePot" ${!S.pots||S.hp>=maxHp()?'disabled':''}>Выпить</button></div>
     <div class="row"><div class="t"><b>Зелье фокуса × ${S.fpots}</b><small>Возвращает 50% фокуса (${S.fp} / ${maxFp()})</small></div><button class="btn" data-act="useFp" ${!S.fpots||S.fp>=maxFp()?'disabled':''}>Выпить</button></div>
     ${S.tails?`<div class="row"><div class="t"><b>Хвост игуаны × ${S.tails}</b><small>Трофей. Продаётся алхимику по ${TAIL_PRICE} золота, нужен травнице Ольхе</small></div></div>`:''}
     ${Object.keys(S.q).filter(q=>QUESTS[q].k==='collect'&&S.q[q].st==='active').map(q=>`<div class="row"><div class="t"><b>${QUESTS[q].item} × ${S.q[q].have}</b><small>Для задания «${QUESTS[q].n}»</small></div></div>`).join('')}</div>`;
  }
  return h;
}
function selItem(){if(!sel)return null;if(sel.eq)return S.eq[sel.eq];return S.inv.find(i=>i.uid===sel.uid)||null}
function itemPanel(){

ACT.htab=k=>{heroTab=k;sel=null;const b=ov.querySelector('.sheet-body');if(b)b.scrollTop=0};
ACT.br=k=>{treeBr=k};
ACT.selEq=s=>{sel=S.eq[s]?{eq:s}:null};
ACT.selInv=u=>{sel={uid:+u}};
ACT.lvpick=id=>{const b=LVB.find(x=>x.id===id);if(!S.lvq||!S.lvopts||!S.lvopts.includes(id))return;if(b.st)S[b.st]+=b.v;else S.bon[b.bon]=(S.bon[b.bon]||0)+b.v;S.lvq--;S.lvopts=null;ensureOpts();S.hp=Math.min(maxHp(),S.hp+(b.id==='hp'?30:b.id==='vit'?20:0));Snd.sfx('level')};
ACT.spec=k=>{if(S.spec||S.lvl<10||!CLASSES[S.cls].specs.includes(k))return;S.spec=k;Snd.sfx('level');toast(`Ты стал: ${SPECS[k].n}`)};
ACT.stat=k=>{if(!S.pts)return;S.pts--;S[k]++;if(k==='vit')S.hp+=10};
ACT.learn=id=>{const n=NODE[id];if(!n||S.tp<1)return;const spent=TREES[n.br].nodes.reduce((a,x)=>a+tr(x.id),0);if(spent<TIER_NEED[n.t]||tr(id)>=n.max)return;S.tp--;S.tree[id]=tr(id)+1;Snd.sfx('level')};
ACT.resetTree=()=>{const cost=50+S.lvl*15;if(S.gold<cost)return;S.gold-=cost;const sum=Object.values(S.tree).reduce((a,v)=>a+v,0);S.tp+=sum;S.tree={};toast('Линии сброшены')};
ACT.equip=a=>{
  const[u,hand]=a.split('|'),i=S.inv.findIndex(x=>x.uid===+u);if(i<0)return;const it=S.inv[i];
  let slot;
  if(it.cat==='weapon')slot=isTwo(it)?'main':(hand||'main');
  else if(it.cat==='shield')slot='off';
  else if(it.cat==='ring')slot=!S.eq.ring?'ring':!S.eq.ring2?'ring2':'ring';
  else slot=it.cat;
  if(slot==='off'&&isTwo(S.eq.main)){if(S.inv.length>=INV_MAX){toast('Рюкзак полон');return}S.inv.push(S.eq.main);S.eq.main=null}
  const back=(S.eq[slot]?1:0)+(slot==='main'&&isTwo(it)&&S.eq.off?1:0);
  if(S.inv.length-1+back>INV_MAX){toast('Рюкзак полон — освободите место');return}
  if(slot==='main'&&isTwo(it)&&S.eq.off)toast('Двуручное оружие: левая рука убрана в рюкзак');  S.inv.splice(i,1);
  if(S.eq[slot])S.inv.push(S.eq[slot]);
  S.eq[slot]=it;
  if(slot==='main'&&isTwo(it)&&S.eq.off){S.inv.push(S.eq.off);S.eq.off=null}
  sel={eq:slot};S.hp=Math.min(S.hp,maxHp());Snd.sfx('coin');
};
ACT.unequip=s=>{const it=S.eq[s];if(!it)return;if(S.inv.length>=INV_MAX){toast('Рюкзак полон');return}S.inv.push(it);S.eq[s]=null;sel=null;S.hp=Math.min(S.hp,maxHp())};
ACT.sellIt=u=>{const i=S.inv.findIndex(it=>it.uid===+u);if(i<0)return;const g=sellPrice(S.inv[i]);S.gold+=g;S.inv.splice(i,1);sel=null;Snd.sfx('coin')};
ACT.sellJunk=()=>{let g=0;S.inv=S.inv.filter(it=>{if(it.rar===0){g+=sellPrice(it);return false}return true});sel=null;if(g){S.gold+=g;Snd.sfx('coin');toast(`Продано на ${g} золота`)}};
ACT.useFp=()=>{if(!S.fpots)return;S.fpots--;S.fp=Math.min(maxFp(),S.fp+Math.round(maxFp()*.5*(1+.15*tr('alchemy'))))};
ACT.usePot=()=>{if(!S.pots)return;S.pots--;S.hp=Math.min(maxHp(),S.hp+Math.round(maxHp()*.4*(1+.15*tr('alchemy'))))};

/* painted overview map: smoothed terrain, relief glyphs, roads, fog, places and labels */
function drawMini(){
  const c=$('#mm');if(!c)return;const N=c.width,s=N/W,x=c.getContext('2d');
  if(!baseLayer)buildBase();if(fogDirty)buildFog();
  x.fillStyle='#0c080e';x.fillRect(0,0,N,N);
  x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
  x.drawImage(baseLayer,0,0,W,H,0,0,N,N);
  /* relief */
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){const k=j*W+i;if(!S.explored[k])continue;const t=tiles[k],b=biomeMap[k],h=hash(i,j),cx=(i+.5)*s+((h&3)-1.5),cy=(j+.5)*s+(((h>>2)&3)-1.5);
    if(t===T_FOREST){x.fillStyle=b===1?'#3e5650':b===2?'#1c2814':'#183a22';x.beginPath();x.moveTo(cx,cy-s*.55);x.lineTo(cx+s*.38,cy+s*.3);x.lineTo(cx-s*.38,cy+s*.3);x.fill();if(b===1){x.fillStyle='#e8f0f4';x.beginPath();x.moveTo(cx,cy-s*.55);x.lineTo(cx+s*.14,cy-s*.22);x.lineTo(cx-s*.14,cy-s*.22);x.fill()}}
    else if(t===T_MOUNT&&h%2===0){x.fillStyle=b===1?'#9aa4b4':'#6a6274';x.beginPath();x.moveTo(cx,cy-s*.75);x.lineTo(cx+s*.75,cy+s*.45);x.lineTo(cx-s*.75,cy+s*.45);x.fill();x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.moveTo(cx,cy-s*.75);x.lineTo(cx+s*.75,cy+s*.45);x.lineTo(cx+s*.1,cy+s*.45);x.fill();x.fillStyle='#e6ecf2';x.beginPath();x.moveTo(cx,cy-s*.75);x.lineTo(cx+s*.25,cy-s*.32);x.lineTo(cx-s*.25,cy-s*.32);x.fill()}
    else if(t===T_WATER&&b!==1&&h%5===0){x.strokeStyle='rgba(170,200,255,.25)';x.lineWidth=1.2;x.beginPath();x.moveTo(cx-s*.4,cy);x.quadraticCurveTo(cx,cy-s*.3,cx+s*.4,cy);x.stroke()}}
  /* roads */
  x.lineCap='round';x.lineJoin='round';
  for(const[w,col]of[[s*.55,'rgba(30,20,12,.55)'],[s*.32,'#9a7a52']]){x.strokeStyle=col;x.lineWidth=w;x.beginPath();
    for(let j=0;j<H;j++)for(let i=0;i<W;i++){if(tiles[j*W+i]!==T_ROAD||!S.explored[j*W+i])continue;const cx=(i+.5)*s,cy=(j+.5)*s;
      if(isRoad(i+1,j)&&S.explored[j*W+i+1]){x.moveTo(cx,cy);x.lineTo(cx+s,cy)}if(isRoad(i,j+1)&&S.explored[(j+1)*W+i]){x.moveTo(cx,cy);x.lineTo(cx,cy+s)}}x.stroke()}
  /* fog with soft edge */
  x.drawImage(fogLayer,0,0,W,H,0,0,N,N);
  /* places */
  x.textAlign='center';x.textBaseline='middle';
  for(const l of LOCS){if(!S.explored[l.y*W+l.x])continue;const cx=(l.x+.5)*s,cy=(l.y+.5)*s;
    if(l.type==='boss'&&!S.bosses[l.boss]){const g=x.createRadialGradient(cx,cy,0,cx,cy,s*3);g.addColorStop(0,'rgba(224,56,79,.55)');g.addColorStop(1,'rgba(224,56,79,0)');x.fillStyle=g;x.fillRect(cx-s*3,cy-s*3,s*6,s*6)}
    if(l.type==='shrine'&&!S.shr[l.id]){const g=x.createRadialGradient(cx,cy,0,cx,cy,s*2.4);g.addColorStop(0,'rgba(140,200,255,.55)');g.addColorStop(1,'rgba(140,200,255,0)');x.fillStyle=g;x.fillRect(cx-s*3,cy-s*3,s*6,s*6)}
    if(l.type==='npc'){const m=npcMark(l.npc);const sz=s*2.4;x.drawImage(getSprite('npc',NPCS[l.npc].pal),cx-sz/2,cy-sz*.8,sz,sz);
      if(m){x.font=`700 ${Math.round(s*2)}px Philosopher, sans-serif`;x.lineWidth=4;x.strokeStyle='#0b070e';x.strokeText(m,cx,cy-s*2);x.fillStyle=m==='?'?'#8fdf6a':'#ffd24a';x.fillText(m,cx,cy-s*2)}continue}
    const sp=l.type==='town'?'town':l.type==='shrine'?'obelisk':l.spr,sz=s*(l.type==='town'?4:l.type==='shrine'?2.6:3.4);
    x.globalAlpha=l.type==='boss'&&S.bosses[l.boss]?.45:1;x.drawImage(getSprite(sp,l.pal),cx-sz/2,cy-sz*.75,sz,sz);x.globalAlpha=1;
    if(l.type==='boss'&&S.bosses[l.boss]){x.strokeStyle='#d9a441';x.lineWidth=3;x.beginPath();x.moveTo(cx-s,cy-s);x.lineTo(cx+s,cy+s);x.moveTo(cx+s,cy-s);x.lineTo(cx-s,cy+s);x.stroke()}
    if(l.type==='town'||l.type==='boss'){x.font=`700 ${Math.round(s*1.55)}px Philosopher, sans-serif`;x.lineWidth=4;x.strokeStyle='rgba(8,5,12,.9)';const ty=cy+s*1.7;x.strokeText(l.name,cx,ty);x.fillStyle=l.type==='town'?'#f0d8a0':'#ffb0b8';x.fillText(l.name,cx,ty)}
  }
  /* you */
  const hx=(S.x+.5)*s,hy=(S.y+.5)*s;
  const g=x.createRadialGradient(hx,hy,0,hx,hy,s*3);g.addColorStop(0,'rgba(255,210,74,.6)');g.addColorStop(1,'rgba(255,210,74,0)');x.fillStyle=g;x.fillRect(hx-s*3,hy-s*3,s*6,s*6);
  const hz=s*3;x.drawImage(getSprite('hero',heroPal()),hx-hz/2,hy-hz*.8,hz,hz);
  x.strokeStyle='#ffd24a';x.lineWidth=2.5;x.beginPath();x.ellipse(hx,hy+s*.4,s*1.1,s*.45,0,0,7);x.stroke();
  /* frame */
  const v=x.createRadialGradient(N/2,N/2,N*.35,N/2,N/2,N*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=v;x.fillRect(0,0,N,N);
  x.strokeStyle='#6a5236';x.lineWidth=6;x.strokeRect(3,3,N-6,N-6);x.strokeStyle='#2a1e14';x.lineWidth=2;x.strokeRect(10,10,N-20,N-20);
}

      a.volume=Math.abs(target-v)<.04?target:v+Math.sign(target-v)*.04;
      if(target===0&&a.volume===0&&!a.paused)a.pause();}
    if(wg)wg.gain.value=failed.explore?.07:0;
  }
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function impulse(sec,decay){const len=Math.floor(ctx.sampleRate*sec),b=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return b}
  function level(kind){if(!prefs[kind])return 0;const v=(kind==='music'?prefs.mvol:prefs.svol)/100;return v*v*1.4}
  function apply(kind){if(!ctx)return;const bus=kind==='music'?musicBus:sfxBus;bus.gain.setTargetAtTime(level(kind),ctx.currentTime,.12)}
  function init(){
    if(ctx){if(ctx.state==='suspended'&&!paused)ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{ctx=new AC()}catch(e){return}
    const master=ctx.createGain();master.gain.value=.85;
    const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
    const rev=ctx.createConvolver();rev.buffer=impulse(3.4,2.6);const rg=ctx.createGain();rg.gain.value=.32;rev.connect(rg);rg.connect(master);
    musicBus=ctx.createGain();musicBus.gain.value=level('music');musicBus.connect(master);musicBus.connect(rev);
    sfxBus=ctx.createGain();sfxBus.gain.value=level('sfx');sfxBus.connect(master);const sr=ctx.createGain();sr.gain.value=.25;sfxBus.connect(sr);sr.connect(rev);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    for(const k in TR){gains[k]=ctx.createGain();gains[k].gain.value=k===cur?1:0;gains[k].connect(musicBus)}
    const wn=ctx.createBufferSource();wn.buffer=noiseBuf;wn.loop=true;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=1.4;
    const lfo=ctx.createOscillator();lfo.frequency.value=.06;const lg=ctx.createGain();lg.gain.value=260;lfo.connect(lg);lg.connect(bp.frequency);
    wg=ctx.createGain();wg.gain.value=0;wn.connect(bp);bp.connect(wg);wg.connect(gains.explore);wn.start();lfo.start();
    nextT=ctx.currentTime+.1;timer=setInterval(tick,25);
    audioFor(cur);audioFor('battle');setInterval(fade,60);
  }
  function tick(){
    if(!ctx||ctx.state!=='running')return;
    const tr0=TR[cur],spb=60/tr0.bpm/4;
    if(!failed[cur]){nextT=ctx.currentTime+.05;return}
    if(nextT<ctx.currentTime-.2)nextT=ctx.currentTime+.05;
    while(nextT<ctx.currentTime+.15){try{tr0.play(step,nextT,gains[cur],spb)}catch(e){}step++;nextT+=spb}
  }
  function setTrack(name){
    if(name===cur||!TR[name])return;
    const old=cur;cur=name;step=0;
    if(!ctx)return;
    audioFor(name);
    const now=ctx.currentTime;
    gains[old].gain.cancelScheduledValues(now);gains[old].gain.setTargetAtTime(0,now,.3);
    gains[name].gain.cancelScheduledValues(now);gains[name].gain.setTargetAtTime(1,now,.35);
    nextT=Math.max(nextT,now+.05);
  }
  function o(type,f,t,stop,out){const x=ctx.createOscillator();x.type=type;x.frequency.setValueAtTime(f,t);x.connect(out);x.start(t);x.stop(stop);return x}
  function vca(out,t,a,d,peak){const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);g.connect(out);return g}
  function lp(out,f,q=.7){const x=ctx.createBiquadFilter();x.type='lowpass';x.frequency.value=f;x.Q.value=q;x.connect(out);return x}
  function noise(t,dur,out){const s=ctx.createBufferSource();s.buffer=noiseBuf;s.connect(out);s.start(t,Math.random());s.stop(t+dur)}
  function pad(out,t,notes,dur,vol,cut=900){
    const g=ctx.createGain(),a=Math.min(1.2,dur*.35),sus=Math.max(t+a,t+dur-.25);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.setValueAtTime(vol,sus);g.gain.linearRampToValueAtTime(.0001,t+dur+.6);g.connect(out);
    const f=lp(g,cut);for(const m of notes)for(const dt of[-7,7]){o('sawtooth',mtof(m),t,t+dur+.7,f).detune.value=dt}
  }
  function pluck(out,t,m,vol,dec=.8,type='triangle'){o(type,mtof(m),t,t+dec+.05,lp(vca(out,t,.005,dec,vol),2600))}
  function bell(out,t,m,vol,dec=2.4){o('sine',mtof(m),t,t+dec,vca(out,t,.004,dec,vol));o('sine',mtof(m)*2.76,t,t+dec*.5,vca(out,t,.004,dec*.45,vol*.25))}
  function bass(out,t,m,dur,vol,cut=500){const g=vca(out,t,.01,dur,vol),f=ctx.createBiquadFilter();f.type='lowpass';f.Q.value=4;
    f.frequency.setValueAtTime(cut*2.2,t);f.frequency.exponentialRampToValueAtTime(cut,t+Math.min(.25,dur));f.connect(g);o('sawtooth',mtof(m),t,t+dur+.05,f)}
  function kick(out,t,vol){const g=vca(out,t,.002,.28,vol),x=o('sine',130,t,t+.3,g);x.frequency.exponentialRampToValueAtTime(38,t+.14)}
  function snare(out,t,vol){const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=1400;hp.connect(vca(out,t,.002,.16,vol));noise(t,.2,hp);o('triangle',190,t,t+.1,vca(out,t,.002,.07,vol*.6))}
  function hat(out,t,vol){const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=7500;hp.connect(vca(out,t,.001,.04,vol));noise(t,.06,hp)}
  function tom(out,t,m,vol){const x=o('sine',mtof(m)*1.6,t,t+.4,vca(out,t,.002,.35,vol));x.frequency.exponentialRampToValueAtTime(mtof(m),t+.2)}
  const AM=[[57,60,64],[53,57,60],[50,53,57],[52,56,59],[57,60,64],[48,52,55],[50,53,57],[52,56,59]];
  const TOWN=[[60,64,67],[55,59,62],[57,60,64],[53,57,60],[60,64,67],[53,57,60],[55,59,62],[55,59,62]];
  const pent=[69,72,74,76,79,81];
  function fight(cfg){return{bpm:cfg.bpm,play(s,t,out,spb){
    const bar=Math.floor(s/16)%4,i=s%16,r=cfg.roots[bar],ch=cfg.chords[bar];
    if(cfg.kicks.includes(i))kick(out,t,.55);
    if(i===4||i===12)snare(out,t,.28);
    if(i%2===0)hat(out,t,i%4?.035:.06);
    bass(out,t,r+cfg.pat[i],spb*.9,.11,cfg.cut);
    if(i===0)pad(out,t,ch.map(m=>m+12),spb*(cfg.organ?16:6),cfg.organ?.03:.04,1700);
    if(i===10&&!cfg.organ)pad(out,t,ch.map(m=>m+12),spb*4,.03,1700);
    if(cfg.organ&&i>=13)tom(out,t,r+12-(i-13)*3,.3);
    const riff=cfg.riff[bar];if(riff&&riff[i])pluck(out,t,riff[i],.045,.22,'square');
  }}}
  const TR={
    explore:{bpm:64,play(s,t,out,spb){
      const bar=Math.floor(s/16)%8,i=s%16,ch=AM[bar];
      if(i===0){pad(out,t,ch,spb*16,.045,650);bass(out,t,ch[0]-24,spb*15,.08,240)}
      if(i%4===0&&Math.random()<.75)pluck(out,t,ch[(i/4+bar)%3]+12,.06,1.3);
      if(i===10&&Math.random()<.4)bell(out,t,pick(pent),.045);
      if(i===6&&Math.random()<.25)pluck(out,t,ch[2]+24,.025,1.8,'sine');
    }},
    town:{bpm:82,play(s,t,out,spb){
      const bar=Math.floor(s/16)%8,i=s%16,ch=TOWN[bar];
      if(i===0){pad(out,t,ch,spb*16,.03,900);bass(out,t,ch[0]-24,spb*7,.07,300)}
      if(i===8)bass(out,t,ch[0]-24+7,spb*7,.05,300);
      if(i%2===0)pluck(out,t,ch[[0,1,2,1,0,2,1,2][i/2]]+12,.045,.7);
      if(i===12&&Math.random()<.5)bell(out,t,ch[2]+24,.03,1.6);
    }},
    battle:fight({bpm:138,cut:700,roots:[38,34,31,33],chords:[[62,65,69],[58,62,65],[55,58,62],[57,61,64]],
      kicks:[0,6,8,11],pat:[0,0,12,0,0,0,10,0,0,0,12,0,0,7,8,7],
      riff:[null,null,{0:74,3:72,4:70,6:67,8:70,10:74,12:72,14:70},{0:73,3:76,4:73,6:69,8:73,10:76,12:79,14:76}]}),
    boss:fight({bpm:150,cut:600,organ:true,roots:[38,39,38,36],chords:[[62,65,69],[63,67,70],[62,65,69],[60,63,67]],
      kicks:[0,4,8,10,12],pat:[0,0,12,0,1,0,12,0,0,0,13,0,1,0,12,1],
      riff:[{0:74,2:75,4:74,6:72,8:74,12:69},{0:75,2:74,4:75,6:79,8:78,12:75},{0:74,2:75,4:74,6:72,8:74,12:77},{0:72,2:75,4:79,6:84,8:79,12:75}]}),
  };
  const FX={
    hit(t){const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1300;bp.connect(vca(sfxBus,t,.002,.12,.5));noise(t,.15,bp);tom(sfxBus,t,40,.35)},
    crit(t){FX.hit(t);bell(sfxBus,t+.02,88,.12,.5)},
    miss(t){const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=2;bp.frequency.setValueAtTime(2500,t);bp.frequency.exponentialRampToValueAtTime(600,t+.18);bp.connect(vca(sfxBus,t,.02,.18,.3));noise(t,.22,bp)},
    hurt(t){kick(sfxBus,t,.5);const lpf=lp(vca(sfxBus,t,.002,.2,.35),900);noise(t,.22,lpf)},
    heal(t){const x=o('sine',520,t,t+.5,vca(sfxBus,t,.02,.45,.2));x.frequency.exponentialRampToValueAtTime(1250,t+.4);bell(sfxBus,t+.25,84,.06,1)},
    coin(t){bell(sfxBus,t,88,.08,.5);bell(sfxBus,t+.08,93,.08,.7)},
    win(t){[69,73,76,81].forEach((m,i)=>bell(sfxBus,t+i*.13,m,.12,1.6));pad(sfxBus,t+.5,[57,61,64,69],1.4,.05,1500)},
    level(t){[72,76,79,84,88].forEach((m,i)=>bell(sfxBus,t+i*.1,m,.11,1.8))},
    lose(t){pad(sfxBus,t,[45,48,52],2.2,.07,600);[64,60,57,52].forEach((m,i)=>bell(sfxBus,t+i*.32,m,.08,1.4))},
  };
  function sfx(name){if(!ctx||!prefs.sfx||ctx.state!=='running'||!FX[name])return;try{FX[name](ctx.currentTime+.01)}catch(e){}}
  function toggle(kind){prefs[kind]=!prefs[kind];savePrefs();apply(kind);return prefs[kind]}
  let volT;
  function setVol(kind,v){prefs[kind==='music'?'mvol':'svol']=clamp(Math.round(v),0,100);apply(kind);clearTimeout(volT);volT=setTimeout(savePrefs,300)}
  function pause(){paused=true;if(ctx&&ctx.state==='running')ctx.suspend();for(const n in files){files[n].volume=0;try{files[n].pause()}catch(e){}}}
  function resume(){paused=false;if(ctx&&ctx.state==='suspended')ctx.resume()}
  document.addEventListener('visibilitychange',()=>document.hidden?pause():resume());
  window.addEventListener('pagehide',pause);
  window.__appPause=pause;window.__appResume=resume;
  ['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,init,{passive:true}));
  return{setTrack,sfx,toggle,setVol,prefs,info:()=>({state:ctx?ctx.state:'none',track:cur,files:Object.fromEntries(Object.entries(files).map(([n,a])=>[n,{vol:+a.volume.toFixed(2),paused:a.paused,failed:!!failed[n]}]))})};
})();
function moodNow(){
  if(!$('#combat').hidden)return C&&C.boss?'boss':'battle';
  const l=locAt[S.y*W+S.x];return l&&l.type==='town'?'town':'explore';
}

/* ---------- boot ---------- */
function boot(saved){
  const has=saved&&saved.explored;
  S=has?migrate(saved):newState();
  genWorld(1337);baseLayer=null;fogDirty=true;
  if(S.migrated){S.needCreate=true;S.keepProgress=true;delete S.migrated}
  if(!S.enemies||!S.enemies.length){S.enemies=[];for(let i=0;i<ENEMY_CAP;i++)spawnGroup(false);for(let i=0;i<14;i++)spawnGroup(false,START)}
  if(!has){S.hp=1}
  /* free-movement fields (older saves stored only tile positions) */
  if(S.px==null){S.px=S.x+.5;S.py=S.y+.5}
  S.face=S.face||1;S.moving=false;
  for(const g of S.enemies){if(g.fx==null){g.fx=g.x+.5;g.fy=g.y+.5}if(g.stun>10)g.stun=3;g.face=g.face||-1}
  {const l=locAt[S.y*W+S.x];S.inLoc=l?l.id:null}
  anim={fx:S.x,fy:S.y,t0:0};path=[];reveal();
  if(S.needCreate)S.intro=false;/* the creation screen is opened from the title menu */
  else{S.hp=Math.max(1,Math.min(S.hp,maxHp()))}
  if(!S.needCreate)updateHud();
  if(!S.needCreate&&!S.joyHint){S.joyHint=true;setTimeout(()=>toast('Новое управление: зажми палец на карте и веди — герой пойдёт'),600)}
  updMusicBtn();
  save();
}
/* art review sheet (open the game with #artgrid): every model on one page, used to compare versions */
function artGrid(){
  const list=[['hero',{}],['hero',{wt:'sword',off:'shield'}],['hero',{wt:'axe'}],['hero',{wt:'staff'}],['hero',{wt:'katana',off:'dagger'}],
    ...Object.keys(EN).map(k=>[EN[k].sp,EN[k].pal]),...Object.keys(BOSS).map(k=>[BOSS[k].sp,BOSS[k].pal]),['npc',NPCS.miron.pal],['npc',NPCS.vera.pal],
    ['town'],['den',DEF_PAL.den],['crypt'],['castle'],['obelisk']];
  document.body.innerHTML=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px;background:radial-gradient(#3a2a34,#0d0a11);min-height:100vh">${list.map(([n,p])=>`<div style="background:#1a1420;border-radius:8px;display:grid;justify-items:center;padding:4px"><img src="${spriteURL(n,p)}" style="width:100%"><small style="color:#aaa;font:11px sans-serif">${n}</small></div>`).join('')}
   ${['sword','dagger','axe','mace','hammer','spear','katana','staff','scythe','shield','helm','armor','gloves','boots','ring','amulet'].map(k=>`<div style="background:#120c16;border-radius:8px;padding:6px"><img src="${spriteURL('i_'+k)}" style="width:100%"></div>`).join('')}</div>`;
}
let started=false;
function start(data){
  if(started)return;started=true;
  aiPreload().then(()=>start2(data));
}
function start2(data){
  if(location.hash==='#artgrid'){artGrid();return}
  boot((data&&data.S)||load());
  resize();window.addEventListener('resize',()=>{resize();if(C)paintScene(sceneKind);if(!titleEl.hidden)paintScene('boss',$('#titleBg'))});
  requestAnimationFrame(loop);
  if(!(data&&data.S))showTitle();else if(S.needCreate)openCreation();
}
try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
